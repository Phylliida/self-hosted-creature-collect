# Build a debug Android APK on a free Ubuntu runner. The output is
# uploaded as a workflow artifact you download to your phone (e.g.
# via Drive / a file share / `adb install`) and sideload directly.
#
# A debug APK is unsigned by Android's release rules but ships with
# Android's standard debug keystore baked into the build, so it
# installs on any device with "Install unknown apps" enabled — no
# Google Play account, no signing config, no Capacitor-side native
# code patches. Significantly simpler than the iOS sideload story
# because Android's WebView (Chromium) handles `https://localhost`
# natively for Service Workers — none of the LocalServer / Swift
# override architecture the iOS build needs.
#
# Live-update on Android: there's no BundleAccess plugin / LocalServer
# overlay here (that's iOS-only Swift), so live-update.js instead
# overlays updated tracked files into the service-worker `app-v1` cache
# (see updateViaCache) — the SW already serves from that cache in
# preference to the bundled assets, so the refresh button picks up new
# code without an APK reinstall. It fetches all files first and only
# commits if every one arrives, so with no data it's a safe no-op. No
# native code needed (so no risk to this build); needs on-device
# verification that the SW intercepts the top-level `/` navigation.
#
# Trigger: same shape as ios-build.yml — manual workflow_dispatch
# plus a path-filtered push to main for relevant changes.

name: Build Android APK (debug, for sideloading)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'assets/**'
      - 'data/BundledData/**'
      - 'scripts/build-capacitor.sh'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'android-debug.keystore'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npm ci` if there's a lock file (faster, reproducible);
      # otherwise fall back to `npm install`. Same pattern as iOS.
      - name: Install JS deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Compose dist/ — same script as iOS, identical webDir output.
      - name: Build Capacitor webDir
        run: bash scripts/build-capacitor.sh

      # JDK 17 is the current Capacitor 6 / Android Gradle Plugin
      # baseline. `temurin` is the standard distribution available
      # on the GitHub-hosted runner.
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The android/ directory is gitignored — generate it fresh from
      # capacitor.config.json on every build. cap add scaffolds the
      # Gradle project; cap sync copies dist/ → assets/public/ and
      # links plugin native code.
      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          # `android/app/src/main/assets/public` is the canonical webDir
          # destination on Android — it's what Capacitor's WebViewClient
          # AssetsPathHandler reads from for page-originated requests AND
          # what the ServiceWorkerClient we install in MainActivity.java
          # below reads from for SW-originated requests. Both paths point
          # at the same bytes, so once the rsync below finishes, every
          # asset is reachable identically through either interception
          # path.
          #
          # Same icons/fonts directory-dropping bug seen on iOS:
          # Capacitor's sync silently strips top-level directories
          # named `icons/` and `fonts/` from the webDir copy. Without
          # this rsync, bundled-data/icons/*.svg and bundled-data/
          # fonts/*.pbf disappear from the APK and POI icons +
          # MapLibre fonts render as blank fallbacks at runtime.
          # rsync without --delete preserves Capacitor's added
          # cordova.js / cordova_plugins.js shims.
          ASSETS_DIR=android/app/src/main/assets/public
          echo "── re-syncing dist/ → $ASSETS_DIR ──"
          rsync -a dist/ "$ASSETS_DIR"/
          echo "  immediate verify after rsync:"
          for d in icons fonts sprites; do
            n=$(find "$ASSETS_DIR/bundled-data/$d" -type f 2>/dev/null | wc -l)
            echo "    bundled-data/$d: $n files"
          done
          # Bump minSdkVersion to 26 (Android 8.0) in variables.gradle.
          # Required by androidx.health.connect:connect-client, which
          # cannot run on older Android anyway (the Health Connect
          # system app itself requires API 26+). The Capacitor 6
          # default is minSdkVersion = 22; dropping API 22-25 means
          # we lose nominal support for Android 5.1/6/7 — devices
          # that are 9+ years old at this point. Acceptable trade.
          echo "── bumping minSdkVersion 22 → 26 in variables.gradle ──"
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("android/variables.gradle")
          text = p.read_text(encoding="utf-8")
          new = re.sub(
              r"(minSdkVersion\s*=\s*)\d+",
              r"\g<1>26",
              text, count=1,
          )
          if new == text:
              print("  WARNING: minSdkVersion line not found in variables.gradle")
          else:
              p.write_text(new, encoding="utf-8")
              print("  done")
          PY
          # Enable Kotlin in the Android project. Capacitor 6's default
          # template is Java-only, but HealthConnectStepPlugin.kt and
          # any future android-overrides/*.kt files need the kotlin-
          # android Gradle plugin applied and the Kotlin stdlib +
          # coroutines on the classpath.
          #
          # We touch two gradle files:
          #   1. android/build.gradle (project-level) — add the Kotlin
          #      Gradle plugin classpath.
          #   2. android/app/build.gradle (app-level) — apply
          #      kotlin-android, plus add stdlib + coroutines deps.
          #
          # Versions pinned alongside what Capacitor 6 expects. When
          # bumping the Health Connect dep (which needs Capacitor 7 /
          # AGP 8.3+ anyway), refresh these too.
          KOTLIN_VERSION=1.9.10
          KOTLINX_COROUTINES_VERSION=1.7.3
          echo "── enabling Kotlin (v$KOTLIN_VERSION) in android project ──"
          python3 - <<PY
          import pathlib, re, sys

          # ── project-level build.gradle: add kotlin-gradle-plugin classpath
          proj = pathlib.Path("android/build.gradle")
          ptext = proj.read_text(encoding="utf-8")
          if "kotlin-gradle-plugin" not in ptext:
              # Anchor on the buildscript { dependencies { ... } } block.
              # Capacitor 6's template has exactly one classpath line
              # inside this block; we tack on a sibling.
              anchor = re.compile(
                  r"(buildscript\s*\{\s*[\s\S]*?dependencies\s*\{\s*\n)(\s*classpath[^\n]*\n)",
                  re.MULTILINE,
              )
              inject = '        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${KOTLIN_VERSION}"\n'
              new = anchor.sub(r"\1\2" + inject, ptext, count=1)
              if new == ptext:
                  print("  ERROR: couldn't find buildscript.dependencies anchor in android/build.gradle", file=sys.stderr)
                  sys.exit(1)
              proj.write_text(new, encoding="utf-8")
              print("  patched android/build.gradle with kotlin-gradle-plugin classpath")
          else:
              print("  android/build.gradle already has kotlin-gradle-plugin")

          # ── app-level build.gradle: apply kotlin-android plugin
          app = pathlib.Path("android/app/build.gradle")
          atext = app.read_text(encoding="utf-8")
          changed = False
          if "kotlin-android" not in atext:
              # The plugin block at the top of app/build.gradle has
              #   apply plugin: 'com.android.application'
              # We append our plugin line right after it.
              anchor = re.compile(r"(apply plugin: 'com\.android\.application'\s*\n)")
              new = anchor.sub(r"\1apply plugin: 'kotlin-android'\n", atext, count=1)
              if new == atext:
                  print("  ERROR: couldn't find com.android.application plugin line in app/build.gradle", file=sys.stderr)
                  sys.exit(1)
              atext = new
              changed = True
              print("  applied kotlin-android plugin to app/build.gradle")

          # Kotlin stdlib + coroutines deps. Same anchor as the other
          # extra deps further down — capacitor-android project dep.
          dep_anchor = re.compile(r"(implementation project\(':capacitor-android'\)\s*\n)")
          extras = []
          if "kotlin-stdlib" not in atext:
              extras.append(f'    implementation "org.jetbrains.kotlin:kotlin-stdlib:${KOTLIN_VERSION}"')
          if "kotlinx-coroutines-android" not in atext:
              extras.append(f'    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:${KOTLINX_COROUTINES_VERSION}"')
          if extras:
              inject = "\n".join(extras) + "\n"
              new = dep_anchor.sub(lambda m: m.group(1) + inject, atext, count=1)
              if new == atext:
                  print("  ERROR: couldn't find capacitor-android dep anchor in app/build.gradle", file=sys.stderr)
                  sys.exit(1)
              atext = new
              changed = True
              for line in extras:
                  print(f"  added: {line.strip()}")

          if changed:
              app.write_text(atext, encoding="utf-8")
          PY
          # Add an explicit androidx.webkit dependency to the app
          # module. Capacitor declares webkit with `implementation`
          # (not `api`) on its own module, which keeps it private to
          # Capacitor's classpath — the app module compiling
          # MainActivity.java can't see ServiceWorkerControllerCompat /
          # ServiceWorkerClientCompat / WebViewAssetLoader symbols
          # without its own dep. `$androidxWebkitVersion` is defined
          # in the generated variables.gradle (1.10.0+ at the time of
          # writing), so we reuse it to stay in lockstep with whatever
          # Capacitor pinned.
          APP_GRADLE=android/app/build.gradle
          echo "── patching $APP_GRADLE for androidx.webkit + play-services-location ──"
          python3 - <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("android/app/build.gradle")
          text = p.read_text(encoding="utf-8")
          # Anchor: the capacitor-android project dep that every
          # generated app/build.gradle has. Insert any extra deps
          # right below it.
          anchor = re.compile(
              r"(implementation project\(':capacitor-android'\)\s*\n)")
          extras = []
          # androidx.webkit — needed by MainActivity.java's
          # ServiceWorkerClient bridge. Capacitor declares it
          # `implementation` (not `api`) on its own module, so the
          # symbols don't reach the app module without an explicit dep.
          if "androidx.webkit:webkit" not in text:
              extras.append('    implementation "androidx.webkit:webkit:$androidxWebkitVersion"')
          # play-services-location — needed by LocationForegroundService
          # (FusedLocationProviderClient). Same transitive-visibility
          # issue: @capacitor/geolocation declares it `implementation`,
          # so we need our own here for the foreground-service plugin.
          # Pin to a recent stable; bump alongside Google Play Services
          # version sweeps.
          if "play-services-location" not in text:
              extras.append('    implementation "com.google.android.gms:play-services-location:21.3.0"')
          # androidx.health.connect:connect-client — Health Connect SDK
          # used by HealthConnectStepPlugin.kt for background step +
          # distance aggregation (Android counterpart to iOS's
          # CMPedometer).
          #
          # Pinned at 1.1.0-alpha07 because:
          #   - 1.0.x only talks to the old "Health Connect (Beta)"
          #     Play Store app, which Android 14+ has retired in favor
          #     of a platform-integrated system service. Users on the
          #     platform version get an "App update needed" error
          #     against any 1.0.x build.
          #   - 1.1.0-alpha08+ bumps the required compileSdk to 35,
          #     and Capacitor 6 ships AGP 8.2.1 (caps at 34). alpha07
          #     is the last release in the 1.1 line that still works
          #     with compileSdk 34, so it's the only version that
          #     simultaneously talks to platform Health Connect *and*
          #     compiles against our current AGP. When Capacitor bumps
          #     to AGP 8.3+ (Capacitor 7) we can move to a current 1.1.x.
          if "androidx.health.connect:connect-client" not in text:
              extras.append('    implementation "androidx.health.connect:connect-client:1.1.0-alpha07"')
          if not extras:
              print("  already present, no change")
              sys.exit(0)
          inject = "\n".join(extras) + "\n"
          new = anchor.sub(lambda m: m.group(1) + inject, text, count=1)
          if new == text:
              print("  ERROR: couldn't find capacitor-android dep anchor", file=sys.stderr)
              sys.exit(1)
          p.write_text(new, encoding="utf-8")
          for line in extras:
              print(f"  added: {line.strip()}")
          PY
          # Inject geolocation permissions into AndroidManifest.xml.
          # Capacitor's `cap add android` generates the manifest from
          # a default template that lacks ACCESS_FINE_LOCATION /
          # ACCESS_COARSE_LOCATION. The web app uses navigator.geolocation
          # which on Android is gated by these manifest permissions —
          # without them the runtime prompt never fires and every fix
          # silently fails.
          MANIFEST=android/app/src/main/AndroidManifest.xml
          echo "── patching $MANIFEST for geolocation + foreground service ──"
          python3 - <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text(encoding="utf-8")
          changed = False
          # 1) Permissions block right after <manifest …>:
          #    - ACCESS_FINE/COARSE_LOCATION : navigator.geolocation gate.
          #    - FOREGROUND_SERVICE          : required to startForeground at all.
          #    - FOREGROUND_SERVICE_LOCATION : Android 14+ requires this for
          #      a service that declares foregroundServiceType="location".
          #    - health.READ_STEPS / READ_DISTANCE : Health Connect data
          #      types HealthConnectStepPlugin reads. Both are subject to
          #      a user-visible grant flow launched by the plugin.
          #    - VIBRATE : navigator.vibrate() in the WebView silently
          #      no-ops (returns true, no buzz, no error) unless the host
          #      app holds this permission — the Extras vibration tool's
          #      Android path is navigator.vibrate, so without this line
          #      it plays patterns into the void. Normal-level permission:
          #      granted at install, no runtime prompt.
          perms = (
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.health.READ_STEPS" />\n'
              '    <uses-permission android:name="android.permission.health.READ_DISTANCE" />\n'
              '    <uses-permission android:name="android.permission.VIBRATE" />\n'
          )
          if "ACCESS_FINE_LOCATION" not in text:
              new = re.sub(r'(<manifest\b[^>]*>\s*\n)', r'\1' + perms, text, count=1)
              if new == text:
                  print("  ERROR: could not find <manifest> tag", file=sys.stderr)
                  sys.exit(1)
              text = new
              changed = True
              print("  added location + foreground-service + health-connect + vibrate permissions")
          # 1b) <queries> block — Android 11+ requires apps to declare
          #     which package names they intend to interact with via
          #     intents. Health Connect's provider package needs to be
          #     listed or createRequestPermissionResultContract() can't
          #     resolve the permission-grant activity.
          queries_tag = (
              '    <queries>\n'
              '        <package android:name="com.google.android.apps.healthdata" />\n'
              '    </queries>\n'
          )
          if "com.google.android.apps.healthdata" not in text:
              # Insert before the closing </manifest>. <queries> is a
              # direct child of <manifest> (peer to <application>).
              new = re.sub(r'(\s*</manifest>)', '\n' + queries_tag + r'\1', text, count=1)
              if new != text:
                  text = new
                  changed = True
                  print("  added Health Connect <queries> tag")
          # 2) Service declaration inside <application>. The plugin's
          #    foreground service holds the persistent notification that
          #    keeps location updates flowing in battery saver / Doze.
          #    Type "location" tells Android the service uses location
          #    so battery-saver throttling is bypassed for it.
          service_tag = (
              '        <service\n'
              '            android:name=".LocationForegroundService"\n'
              '            android:exported="false"\n'
              '            android:foregroundServiceType="location" />\n'
          )
          if "LocationForegroundService" not in text:
              # Insert just before </application>.
              new = re.sub(r'(\s*</application>)', '\n' + service_tag + r'\1', text, count=1)
              if new == text:
                  print("  ERROR: could not find </application> tag", file=sys.stderr)
                  sys.exit(1)
              text = new
              changed = True
              print("  added LocationForegroundService declaration")
          # 3) Health Connect permission-rationale activity-alias.
          #    Android 14+'s Health Connect permission UI deep-links
          #    back into the app via this intent-filter so the user
          #    can review what data we read. Without it the grant
          #    flow may complete with a permission-denied state even
          #    when the user approved.
          rationale_tag = (
              '        <activity-alias\n'
              '            android:name="ViewPermissionUsageActivity"\n'
              '            android:exported="true"\n'
              '            android:targetActivity=".MainActivity"\n'
              '            android:permission="android.permission.START_VIEW_PERMISSION_USAGE">\n'
              '            <intent-filter>\n'
              '                <action android:name="android.intent.action.VIEW_PERMISSION_USAGE" />\n'
              '                <category android:name="android.intent.category.HEALTH_PERMISSIONS" />\n'
              '            </intent-filter>\n'
              '        </activity-alias>\n'
          )
          if "ViewPermissionUsageActivity" not in text:
              new = re.sub(r'(\s*</application>)', '\n' + rationale_tag + r'\1', text, count=1)
              if new != text:
                  text = new
                  changed = True
                  print("  added Health Connect permission-rationale activity-alias")
          if changed:
              p.write_text(text, encoding="utf-8")
          else:
              print("  already present, no change")
          PY
          # Overwrite MainActivity.java with one that wires up a
          # ServiceWorkerClient delegating to a parallel WebViewAssetLoader.
          # Background: Android WebView has TWO request-interception paths.
          # `WebViewClient.shouldInterceptRequest` handles requests
          # originated by the page; Capacitor wires that one to its asset
          # loader. `ServiceWorkerController.shouldInterceptRequest`
          # (separate API) handles requests originated from inside a
          # Service Worker — including the SW script-fetch itself. Capacitor
          # leaves the latter unconfigured, so SW registration fails
          # against `https://localhost/sw.js` with the generic Chromium
          # message "An unknown error occurred when fetching the script"
          # even though the script is reachable via `WebViewClient`. The
          # same fix Cordova shipped in
          # ionic-team/cordova-plugin-ionic-webview#452: install a
          # ServiceWorkerClient backed by an equivalent
          # WebViewAssetLoader. Once registered, all SW-originated fetches
          # resolve via assets/public/, matching the WebViewClient path.
          # External URLs (e.g., tile-server downloads) fall through and
          # hit the network as expected.
          echo "── writing MainActivity.java with SW bridge ──"
          python3 - <<'PY'
          import json, pathlib
          cfg = json.loads(pathlib.Path("capacitor.config.json").read_text())
          app_id = cfg["appId"]                       # e.g. org.phylliidaassets.creaturecollect
          pkg_dir = pathlib.Path("android/app/src/main/java") / pathlib.Path(*app_id.split("."))
          pkg_dir.mkdir(parents=True, exist_ok=True)
          main_activity = pkg_dir / "MainActivity.java"
          main_activity.write_text(f"""package {app_id};

          import android.os.Bundle;
          import android.webkit.MimeTypeMap;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;

          import androidx.annotation.NonNull;
          import androidx.webkit.ServiceWorkerClientCompat;
          import androidx.webkit.ServiceWorkerControllerCompat;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewFeature;

          import com.getcapacitor.BridgeActivity;

          import java.io.IOException;
          import java.io.InputStream;

          public class MainActivity extends BridgeActivity {{
              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  // Register custom Capacitor plugins BEFORE super.onCreate
                  // (Capacitor docs are explicit on this — registration
                  // must happen during the activity's pre-init pass so
                  // the plugin classes are available when the WebView
                  // constructs Capacitor.Plugins.<Name>).
                  registerPlugin(BackgroundLocationPlugin.class);
                  registerPlugin(HealthConnectStepPlugin.class);
                  registerPlugin(HapticPatternPlugin.class);
                  super.onCreate(savedInstanceState);
                  // Capacitor wires WebViewAssetLoader for page-originated
                  // requests via WebViewClient. SW-originated requests
                  // (script load + fetch handlers) take a separate
                  // interception path through ServiceWorkerController.
                  // Without an explicit ServiceWorkerClient those fail
                  // with Chromium's generic "unknown error" message and
                  // SW registration is impossible. This installs a
                  // parallel asset loader on the SW path so /sw.js
                  // resolves and the SW can take over offline caching.
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.SERVICE_WORKER_BASIC_USAGE)) {{
                      // Capacitor stages the webDir at `assets/public/`,
                      // not the `assets/` root, so the stock 1-arg
                      // AssetsPathHandler (which only serves from root)
                      // can't find sw.js or any of the other webDir
                      // files. Custom PathHandler prepends "public/" and
                      // infers MIME via Android's MimeTypeMap — critical
                      // because Chromium rejects SW registration if
                      // sw.js comes back with the wrong MIME (must be
                      // `application/javascript`, which is what the .js
                      // extension maps to).
                      final WebViewAssetLoader.PathHandler publicAssets =
                          new WebViewAssetLoader.PathHandler() {{
                              @Override
                              public WebResourceResponse handle(@NonNull String path) {{
                                  // Directory-index resolution: an empty path
                                  // ("/" stripped of the registered prefix)
                                  // or any trailing-slash path resolves to
                                  // index.html — same convention every
                                  // static file server uses. Without this
                                  // the navigation to `/` (which the SW
                                  // intercepts and forwards through this
                                  // handler) tries to open the directory
                                  // `public/` as a stream and throws,
                                  // breaking the page load with
                                  // net::ERR_FAILED on every refresh once
                                  // the SW is active.
                                  String assetPath = "public/" + path;
                                  if (path.isEmpty() || path.endsWith("/")) {{
                                      assetPath = assetPath + "index.html";
                                  }}
                                  try {{
                                      InputStream is = getAssets().open(assetPath);
                                      String ext = MimeTypeMap.getFileExtensionFromUrl(assetPath);
                                      String mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext);
                                      if (mime == null) mime = "application/octet-stream";
                                      return new WebResourceResponse(mime, null, is);
                                  }} catch (IOException e) {{
                                      // Asset not found → fall through to
                                      // the network. For SW-originated
                                      // requests this means external URLs
                                      // (e.g., tile-server downloads) hit
                                      // the wire as expected.
                                      return null;
                                  }}
                              }}
                          }};
                      final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .setDomain("localhost")
                          .addPathHandler("/", publicAssets)
                          .build();
                      ServiceWorkerControllerCompat.getInstance().setServiceWorkerClient(
                          new ServiceWorkerClientCompat() {{
                              @Override
                              public WebResourceResponse shouldInterceptRequest(WebResourceRequest request) {{
                                  return loader.shouldInterceptRequest(request.getUrl());
                              }}
                          }}
                      );
                  }}
              }}
          }}
          """, encoding="utf-8")
          print(f"  wrote {main_activity}")
          PY
          # Write BackgroundLocationPlugin.java + LocationForegroundService.java.
          # Why a custom plugin: navigator.geolocation on Android (whether
          # via WebView's built-in or @capacitor/geolocation) is throttled
          # by Battery Saver and Doze mode — without a foreground service,
          # location updates drop to once every several minutes and the
          # daycare distance tracker stalls when the screen turns off.
          # The plugin starts a Service with `foregroundServiceType="location"`
          # and a persistent notification, which exempts the location
          # stream from throttling for as long as the user has chosen to
          # walk with the app. The service uses FusedLocationProviderClient
          # at HIGH_ACCURACY priority and forwards every fix to JS via
          # the Capacitor bridge's `notifyListeners`.
          echo "── writing BackgroundLocationPlugin.java + service ──"
          python3 - <<'PY'
          import json, pathlib
          cfg = json.loads(pathlib.Path("capacitor.config.json").read_text())
          app_id = cfg["appId"]
          pkg_dir = pathlib.Path("android/app/src/main/java") / pathlib.Path(*app_id.split("."))
          pkg_dir.mkdir(parents=True, exist_ok=True)

          plugin = pkg_dir / "BackgroundLocationPlugin.java"
          plugin.write_text(f"""package {app_id};

          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.os.Build;

          import androidx.core.app.ActivityCompat;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          /**
           * BackgroundLocation plugin. JS exposure: window.Capacitor.Plugins.BackgroundLocation.
           * Methods:
           *   start()   — checks/requests location permission, starts the
           *               foreground service (which begins streaming fixes).
           *   stop()    — stops the service, ending location updates AND
           *               removing the persistent notification.
           * Events:
           *   "location" — emitted by the service for each location fix.
           *                Detail: {{ latitude, longitude, accuracy, altitude,
           *                speed, heading, timestamp }}.
           */
          @CapacitorPlugin(
              name = "BackgroundLocation",
              permissions = {{
                  @Permission(strings = {{ Manifest.permission.ACCESS_FINE_LOCATION }}, alias = "fine"),
                  @Permission(strings = {{ Manifest.permission.ACCESS_COARSE_LOCATION }}, alias = "coarse"),
              }}
          )
          public class BackgroundLocationPlugin extends Plugin {{
              private static BackgroundLocationPlugin instance;

              @Override
              public void load() {{
                  super.load();
                  instance = this;
              }}

              @PluginMethod
              public void start(PluginCall call) {{
                  Context ctx = getContext();
                  // If neither fine nor coarse is granted, request fine
                  // (which auto-grants coarse on most OEMs). The
                  // permissionsCallback resumes the start() flow on grant.
                  boolean hasFine = ActivityCompat.checkSelfPermission(
                      ctx, Manifest.permission.ACCESS_FINE_LOCATION)
                          == PackageManager.PERMISSION_GRANTED;
                  boolean hasCoarse = ActivityCompat.checkSelfPermission(
                      ctx, Manifest.permission.ACCESS_COARSE_LOCATION)
                          == PackageManager.PERMISSION_GRANTED;
                  if (!hasFine && !hasCoarse) {{
                      requestPermissionForAlias("fine", call, "permsCallback");
                      return;
                  }}
                  Intent intent = new Intent(ctx, LocationForegroundService.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {{
                      ctx.startForegroundService(intent);
                  }} else {{
                      ctx.startService(intent);
                  }}
                  JSObject result = new JSObject();
                  result.put("started", true);
                  call.resolve(result);
              }}

              @PermissionCallback
              private void permsCallback(PluginCall call) {{
                  PermissionState fine = getPermissionState("fine");
                  PermissionState coarse = getPermissionState("coarse");
                  if (fine == PermissionState.GRANTED || coarse == PermissionState.GRANTED) {{
                      // Re-enter start() now that permission landed.
                      start(call);
                  }} else {{
                      call.reject("Location permission denied");
                  }}
              }}

              @PluginMethod
              public void stop(PluginCall call) {{
                  Context ctx = getContext();
                  Intent intent = new Intent(ctx, LocationForegroundService.class);
                  ctx.stopService(intent);
                  call.resolve();
              }}

              /**
               * Bridge from LocationForegroundService → JS. Called from
               * the FusedLocationProviderClient callback on the main
               * thread; notifyListeners is thread-safe so this is fine.
               */
              static void notifyLocation(Location loc) {{
                  if (instance == null || loc == null) return;
                  JSObject data = new JSObject();
                  data.put("latitude", loc.getLatitude());
                  data.put("longitude", loc.getLongitude());
                  data.put("accuracy", loc.getAccuracy());
                  if (loc.hasAltitude()) data.put("altitude", loc.getAltitude());
                  if (loc.hasSpeed()) data.put("speed", loc.getSpeed());
                  if (loc.hasBearing()) data.put("heading", loc.getBearing());
                  data.put("timestamp", loc.getTime());
                  instance.notifyListeners("location", data);
              }}
          }}
          """, encoding="utf-8")
          print(f"  wrote {plugin}")

          service = pkg_dir / "LocationForegroundService.java"
          service.write_text(f"""package {app_id};

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.location.Location;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.Looper;

          import androidx.core.app.NotificationCompat;

          import com.google.android.gms.location.FusedLocationProviderClient;
          import com.google.android.gms.location.LocationCallback;
          import com.google.android.gms.location.LocationRequest;
          import com.google.android.gms.location.LocationResult;
          import com.google.android.gms.location.LocationServices;
          import com.google.android.gms.location.Priority;

          /**
           * Foreground service that holds a persistent notification and
           * streams high-accuracy location fixes via FusedLocationProvider.
           * The notification is what tells Android "this app is doing
           * user-visible work" — without it Battery Saver / Doze throttle
           * the location stream to once-every-several-minutes.
           */
          public class LocationForegroundService extends Service {{
              private static final String CHANNEL_ID = "creature_collect_location";
              private static final int NOTIFICATION_ID = 7142;
              // Update cadence: 5 s nominal, 2 s minimum if a fix arrives
              // sooner. Tuned for daycare distance tracking — the daycare
              // accumulator already filters jitter at 10 m, so faster
              // fixes don't help; 5 s keeps battery use sane.
              private static final long UPDATE_INTERVAL_MS = 5000L;
              private static final long FASTEST_INTERVAL_MS = 2000L;

              private FusedLocationProviderClient fused;
              private LocationCallback callback;

              @Override
              public IBinder onBind(Intent intent) {{ return null; }}

              @Override
              public void onCreate() {{
                  super.onCreate();
                  ensureChannel();
                  Notification notif = buildNotification();
                  // Android 14+ (UPSIDE_DOWN_CAKE / API 34) requires the
                  // foreground-service-type to be passed at startForeground
                  // time AND for FOREGROUND_SERVICE_LOCATION permission to
                  // be declared in the manifest (which we do).
                  if (Build.VERSION.SDK_INT >= 34) {{
                      startForeground(NOTIFICATION_ID, notif,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION);
                  }} else {{
                      startForeground(NOTIFICATION_ID, notif);
                  }}
                  fused = LocationServices.getFusedLocationProviderClient(this);
                  callback = new LocationCallback() {{
                      @Override
                      public void onLocationResult(LocationResult result) {{
                          for (Location loc : result.getLocations()) {{
                              BackgroundLocationPlugin.notifyLocation(loc);
                          }}
                      }}
                  }};
                  LocationRequest req = new LocationRequest.Builder(
                          Priority.PRIORITY_HIGH_ACCURACY, UPDATE_INTERVAL_MS)
                      .setMinUpdateIntervalMillis(FASTEST_INTERVAL_MS)
                      .build();
                  try {{
                      fused.requestLocationUpdates(req, callback, Looper.getMainLooper());
                  }} catch (SecurityException e) {{
                      // Permission missing — service stays alive (notification
                      // visible) but no fixes will flow. The plugin's
                      // start() entry already gates on permission, so this
                      // path shouldn't fire on a healthy build.
                  }}
              }}

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {{
                  // STICKY: if the OS kills the service for memory pressure,
                  // it will be re-created (without the original intent) so
                  // location updates resume on its own.
                  return START_STICKY;
              }}

              @Override
              public void onDestroy() {{
                  if (fused != null && callback != null) {{
                      try {{ fused.removeLocationUpdates(callback); }}
                      catch (Exception e) {{ /* best-effort */ }}
                  }}
                  super.onDestroy();
              }}

              private void ensureChannel() {{
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {{
                      NotificationManager nm = (NotificationManager)
                          getSystemService(NOTIFICATION_SERVICE);
                      NotificationChannel ch = new NotificationChannel(
                          CHANNEL_ID, "Walk tracking", NotificationManager.IMPORTANCE_LOW);
                      ch.setDescription(
                          "Active while you're walking with a pokémon in the daycare. "
                          + "Tap to return to the app.");
                      nm.createNotificationChannel(ch);
                  }}
              }}

              private Notification buildNotification() {{
                  Intent launch = getPackageManager().getLaunchIntentForPackage(getPackageName());
                  PendingIntent pi = null;
                  if (launch != null) {{
                      pi = PendingIntent.getActivity(this, 0, launch,
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  }}
                  NotificationCompat.Builder b = new NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("Creature Collect")
                      .setContentText("Tracking your walk")
                      .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                      .setOngoing(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW);
                  if (pi != null) b.setContentIntent(pi);
                  return b.build();
              }}
          }}
          """, encoding="utf-8")
          print(f"  wrote {service}")
          PY
          # Copy android-overrides/*.{java,kt} into the generated
          # package tree. Same shape as ios-overrides/ — real source
          # files that drop in at build time. New native plugins land
          # here rather than as inline-in-YAML blobs.
          #
          # The package path is derived from capacitor.config.json's
          # appId so each file's `package org.phylliidaassets...` line
          # must match the appId (today: org.phylliidaassets.creaturecollect).
          OVERRIDES_DIR=android-overrides
          if [ -d "$OVERRIDES_DIR" ]; then
            echo "── copying $OVERRIDES_DIR/*.{java,kt} into package tree ──"
            python3 - <<'PY'
          import json, pathlib, shutil
          cfg = json.loads(pathlib.Path("capacitor.config.json").read_text())
          app_id = cfg["appId"]
          pkg_dir = pathlib.Path("android/app/src/main/java") / pathlib.Path(*app_id.split("."))
          pkg_dir.mkdir(parents=True, exist_ok=True)
          src_dir = pathlib.Path("android-overrides")
          for pattern in ("*.java", "*.kt"):
              for src in sorted(src_dir.glob(pattern)):
                  dst = pkg_dir / src.name
                  shutil.copyfile(src, dst)
                  print(f"  copied {src} → {dst}")
          PY
          fi

      - name: Debug — assets folder after cap sync
        run: |
          ASSETS_DIR=android/app/src/main/assets/public
          echo "── $ASSETS_DIR top level ──"
          ls -la "$ASSETS_DIR" | head -20
          echo "── $ASSETS_DIR/bundled-data top level ──"
          ls -la "$ASSETS_DIR/bundled-data" | head -20
          echo "── file counts per subdir ──"
          for d in icons fonts sprites tiles; do
            n=$(find "$ASSETS_DIR/bundled-data/$d" -type f 2>/dev/null | wc -l)
            echo "  bundled-data/$d: $n files"
          done
          for d in icons fonts tiles; do
            n=$(find "$ASSETS_DIR/$d" -type f 2>/dev/null | wc -l)
            echo "  /$d (alias): $n files"
          done
          echo "  total .svg: $(find "$ASSETS_DIR" -name '*.svg' | wc -l)"

      # Stage the project's pinned debug keystore at the location
      # Android Gradle Plugin auto-detects (~/.android/debug.keystore).
      # AGP's `debug` build type uses that file with alias
      # `androiddebugkey` and password `android` by default — same
      # convention Android Studio creates per-developer-machine.
      #
      # Why pin one in the repo: each CI run regenerates the android/
      # scaffolding from scratch. Without a pinned keystore, every
      # build would use a new auto-generated cert, and APKs from
      # different runs would refuse to update each other on-device
      # (`INSTALL_FAILED_UPDATE_INCOMPATIBLE` — signature mismatch).
      # Committing one keystore = stable cert across all builds =
      # `adb install -r -d` works without uninstalling first.
      #
      # Safe to commit: this is a *debug* keystore, equivalent to the
      # one Android Studio auto-generates. Real release signing would
      # use a separate keystore loaded from a GitHub Actions secret.
      - name: Stage + pin debug keystore
        run: |
          # The committed android-debug.keystore exists to give every CI
          # build the SAME signing cert, so `adb install -r` updates work
          # without uninstalling first. But on the GitHub runner AGP resolves
          # the default debug keystore via ANDROID_USER_HOME / ANDROID_SDK_HOME
          # (NOT ~/.android), so the staged copy below was being IGNORED and
          # each build fell back to a freshly auto-generated key — the cert
          # rotated every run → INSTALL_FAILED_UPDATE_INCOMPATIBLE on every
          # on-device update. Fix: pin an explicit, env-independent debug
          # signingConfig in app/build.gradle pointing at the committed
          # keystore copied into the module. (The ~/.android stage is kept as
          # a harmless fallback for any tooling that still reads it.)
          mkdir -p ~/.android
          cp android-debug.keystore ~/.android/debug.keystore
          cp android-debug.keystore android/app/cc-debug.keystore
          python3 - <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("android/app/build.gradle")
          s = p.read_text(encoding="utf-8")
          if "cc-debug.keystore" in s:
              print("  debug signingConfig already pinned")
              raise SystemExit(0)
          # Capacitor's generated app/build.gradle has no signingConfigs block
          # (it relies on AGP's default debug config). Insert one right after
          # `android {` that reconfigures the auto-created `debug` config; the
          # debug build type already uses signingConfigs.debug by default.
          block = (
              "\n    signingConfigs {\n"
              "        debug {\n"
              "            storeFile file('cc-debug.keystore')\n"
              "            storePassword 'android'\n"
              "            keyAlias 'androiddebugkey'\n"
              "            keyPassword 'android'\n"
              "        }\n"
              "    }\n"
          )
          m = re.search(r"\nandroid\s*\{", s)
          if not m:
              print("  ERROR: no `android {` block in app/build.gradle", file=sys.stderr)
              sys.exit(1)
          i = m.end()
          p.write_text(s[:i] + block + s[i:], encoding="utf-8")
          print("  pinned debug signingConfig -> android/app/cc-debug.keystore")
          PY
          echo "── all CI builds now sign with this (stable) cert ──"
          keytool -list -v -keystore android-debug.keystore -storepass android \
            | grep -E "SHA256:|androiddebugkey" || true

      # Set the launcher icon from assets/icon-only.png (a squared copy of
      # tmpicon). @capacitor/assets regenerates every mipmap density + the
      # adaptive icon into the freshly-scaffolded android/ project.
      # continue-on-error: an icon hiccup must NEVER block the APK — worst
      # case the build just keeps Capacitor's default icon.
      - name: Generate app icon
        continue-on-error: true
        run: |
          npx --yes @capacitor/assets generate \
            --android \
            --iconBackgroundColor '#395273' \
            --iconBackgroundColorDark '#395273'

      # `assembleDebug` produces a debug-keystore-signed APK at:
      #   android/app/build/outputs/apk/debug/app-debug.apk
      # That's the file you sideload.
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "no APK produced"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: creature-collect-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
