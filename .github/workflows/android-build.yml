# Build a debug Android APK on a free Ubuntu runner. The output is
# uploaded as a workflow artifact you download to your phone (e.g.
# via Drive / a file share / `adb install`) and sideload directly.
#
# A debug APK is unsigned by Android's release rules but ships with
# Android's standard debug keystore baked into the build, so it
# installs on any device with "Install unknown apps" enabled — no
# Google Play account, no signing config, no Capacitor-side native
# code patches. Significantly simpler than the iOS sideload story
# because Android's WebView (Chromium) handles `https://localhost`
# natively for Service Workers — none of the LocalServer / Swift
# override architecture the iOS build needs.
#
# Caveat: live-update.js's BundleAccess plugin is iOS-only Swift,
# so refresh-button live updates are no-ops on Android. The fallback
# path is fine — `done()` runs a plain reload + cache clear (since
# `Capacitor.Plugins.BundleAccess` is undefined). Spouse / Android
# testers get fresh code by reinstalling the APK each release; a
# Kotlin port of BundleAccessPlugin is the follow-up if/when that
# friction matters.
#
# Trigger: same shape as ios-build.yml — manual workflow_dispatch
# plus a path-filtered push to main for relevant changes.

name: Build Android APK (debug, for sideloading)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'data/BundledData/**'
      - 'scripts/build-capacitor.sh'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npm ci` if there's a lock file (faster, reproducible);
      # otherwise fall back to `npm install`. Same pattern as iOS.
      - name: Install JS deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Compose dist/ — same script as iOS, identical webDir output.
      - name: Build Capacitor webDir
        run: bash scripts/build-capacitor.sh

      # JDK 17 is the current Capacitor 6 / Android Gradle Plugin
      # baseline. `temurin` is the standard distribution available
      # on the GitHub-hosted runner.
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The android/ directory is gitignored — generate it fresh from
      # capacitor.config.json on every build. cap add scaffolds the
      # Gradle project; cap sync copies dist/ → assets/public/ and
      # links plugin native code.
      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          # `android/app/src/main/assets/public` is the canonical webDir
          # destination on Android — it's what Capacitor's WebViewClient
          # AssetsPathHandler reads from for page-originated requests AND
          # what the ServiceWorkerClient we install in MainActivity.java
          # below reads from for SW-originated requests. Both paths point
          # at the same bytes, so once the rsync below finishes, every
          # asset is reachable identically through either interception
          # path.
          #
          # Same icons/fonts directory-dropping bug seen on iOS:
          # Capacitor's sync silently strips top-level directories
          # named `icons/` and `fonts/` from the webDir copy. Without
          # this rsync, bundled-data/icons/*.svg and bundled-data/
          # fonts/*.pbf disappear from the APK and POI icons +
          # MapLibre fonts render as blank fallbacks at runtime.
          # rsync without --delete preserves Capacitor's added
          # cordova.js / cordova_plugins.js shims.
          ASSETS_DIR=android/app/src/main/assets/public
          echo "── re-syncing dist/ → $ASSETS_DIR ──"
          rsync -a dist/ "$ASSETS_DIR"/
          echo "  immediate verify after rsync:"
          for d in icons fonts sprites; do
            n=$(find "$ASSETS_DIR/bundled-data/$d" -type f 2>/dev/null | wc -l)
            echo "    bundled-data/$d: $n files"
          done
          # Add an explicit androidx.webkit dependency to the app
          # module. Capacitor declares webkit with `implementation`
          # (not `api`) on its own module, which keeps it private to
          # Capacitor's classpath — the app module compiling
          # MainActivity.java can't see ServiceWorkerControllerCompat /
          # ServiceWorkerClientCompat / WebViewAssetLoader symbols
          # without its own dep. `$androidxWebkitVersion` is defined
          # in the generated variables.gradle (1.10.0+ at the time of
          # writing), so we reuse it to stay in lockstep with whatever
          # Capacitor pinned.
          APP_GRADLE=android/app/build.gradle
          echo "── patching $APP_GRADLE for androidx.webkit ──"
          python3 - <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("android/app/build.gradle")
          text = p.read_text(encoding="utf-8")
          if 'androidx.webkit:webkit' in text:
              print("  already present, no change")
              sys.exit(0)
          # Insert right after the capacitor-android project dep, which
          # is the canonical anchor in the generated build.gradle.
          dep_line = '    implementation "androidx.webkit:webkit:$androidxWebkitVersion"\n'
          new = re.sub(
              r"(implementation project\(':capacitor-android'\)\s*\n)",
              r"\1" + dep_line, text, count=1)
          if new == text:
              print("  ERROR: couldn't find capacitor-android dep anchor", file=sys.stderr)
              sys.exit(1)
          p.write_text(new, encoding="utf-8")
          print("  added androidx.webkit:webkit dependency")
          PY
          # Inject geolocation permissions into AndroidManifest.xml.
          # Capacitor's `cap add android` generates the manifest from
          # a default template that lacks ACCESS_FINE_LOCATION /
          # ACCESS_COARSE_LOCATION. The web app uses navigator.geolocation
          # which on Android is gated by these manifest permissions —
          # without them the runtime prompt never fires and every fix
          # silently fails.
          MANIFEST=android/app/src/main/AndroidManifest.xml
          echo "── patching $MANIFEST for geolocation ──"
          python3 - <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text(encoding="utf-8")
          perms = (
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
          )
          if "ACCESS_FINE_LOCATION" in text:
              print("  already present, no change")
              sys.exit(0)
          # Insert the two lines right after the opening <manifest …> tag.
          new = re.sub(r'(<manifest\b[^>]*>\s*\n)', r'\1' + perms, text, count=1)
          if new == text:
              print("  ERROR: could not find <manifest> tag", file=sys.stderr)
              sys.exit(1)
          p.write_text(new, encoding="utf-8")
          print("  added ACCESS_FINE_LOCATION + ACCESS_COARSE_LOCATION")
          PY
          # Overwrite MainActivity.java with one that wires up a
          # ServiceWorkerClient delegating to a parallel WebViewAssetLoader.
          # Background: Android WebView has TWO request-interception paths.
          # `WebViewClient.shouldInterceptRequest` handles requests
          # originated by the page; Capacitor wires that one to its asset
          # loader. `ServiceWorkerController.shouldInterceptRequest`
          # (separate API) handles requests originated from inside a
          # Service Worker — including the SW script-fetch itself. Capacitor
          # leaves the latter unconfigured, so SW registration fails
          # against `https://localhost/sw.js` with the generic Chromium
          # message "An unknown error occurred when fetching the script"
          # even though the script is reachable via `WebViewClient`. The
          # same fix Cordova shipped in
          # ionic-team/cordova-plugin-ionic-webview#452: install a
          # ServiceWorkerClient backed by an equivalent
          # WebViewAssetLoader. Once registered, all SW-originated fetches
          # resolve via assets/public/, matching the WebViewClient path.
          # External URLs (e.g., tile-server downloads) fall through and
          # hit the network as expected.
          echo "── writing MainActivity.java with SW bridge ──"
          python3 - <<'PY'
          import json, pathlib
          cfg = json.loads(pathlib.Path("capacitor.config.json").read_text())
          app_id = cfg["appId"]                       # e.g. org.phylliidaassets.creaturecollect
          pkg_dir = pathlib.Path("android/app/src/main/java") / pathlib.Path(*app_id.split("."))
          pkg_dir.mkdir(parents=True, exist_ok=True)
          main_activity = pkg_dir / "MainActivity.java"
          main_activity.write_text(f"""package {app_id};

          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;

          import androidx.webkit.ServiceWorkerClientCompat;
          import androidx.webkit.ServiceWorkerControllerCompat;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewFeature;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{
              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  // Capacitor wires WebViewAssetLoader for page-originated
                  // requests via WebViewClient. SW-originated requests
                  // (script load + fetch handlers) take a separate
                  // interception path through ServiceWorkerController.
                  // Without an explicit ServiceWorkerClient those fail
                  // with Chromium's generic "unknown error" message and
                  // SW registration is impossible. This installs a
                  // parallel asset loader on the SW path so /sw.js
                  // resolves and the SW can take over offline caching.
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.SERVICE_WORKER_BASIC_USAGE)) {{
                      final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .setDomain("localhost")
                          .addPathHandler("/", new WebViewAssetLoader.AssetsPathHandler(this, "public"))
                          .build();
                      ServiceWorkerControllerCompat.getInstance().setServiceWorkerClient(
                          new ServiceWorkerClientCompat() {{
                              @Override
                              public WebResourceResponse shouldInterceptRequest(WebResourceRequest request) {{
                                  return loader.shouldInterceptRequest(request.getUrl());
                              }}
                          }}
                      );
                  }}
              }}
          }}
          """, encoding="utf-8")
          print(f"  wrote {main_activity}")
          PY

      - name: Debug — assets folder after cap sync
        run: |
          ASSETS_DIR=android/app/src/main/assets/public
          echo "── $ASSETS_DIR top level ──"
          ls -la "$ASSETS_DIR" | head -20
          echo "── $ASSETS_DIR/bundled-data top level ──"
          ls -la "$ASSETS_DIR/bundled-data" | head -20
          echo "── file counts per subdir ──"
          for d in icons fonts sprites tiles; do
            n=$(find "$ASSETS_DIR/bundled-data/$d" -type f 2>/dev/null | wc -l)
            echo "  bundled-data/$d: $n files"
          done
          for d in icons fonts tiles; do
            n=$(find "$ASSETS_DIR/$d" -type f 2>/dev/null | wc -l)
            echo "  /$d (alias): $n files"
          done
          echo "  total .svg: $(find "$ASSETS_DIR" -name '*.svg' | wc -l)"

      # `assembleDebug` produces an unsigned-for-release-but-signed-
      # with-the-debug-keystore APK at:
      #   android/app/build/outputs/apk/debug/app-debug.apk
      # That's the file you sideload.
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "no APK produced"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: creature-collect-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
