# Build an unsigned iOS IPA on a free macOS runner. The output is
# uploaded as a workflow artifact you download to your Linux box,
# then sideload onto your iPhone via SideStore (or AltServer-Linux).
#
# Sideloading tools re-sign the IPA with your Apple ID at install
# time, so we don't need a paid Apple Developer account or any signing
# secrets in the repo. CODE_SIGNING_ALLOWED=NO + manual Payload/
# zipping gives us a fully unsigned IPA that SideStore is happy with.
#
# Trigger: manual (workflow_dispatch) so you control when builds
# happen — and a path-filtered push so deploys to main of relevant
# files build automatically. Adjust to taste.

name: Build iOS IPA (unsigned, for sideloading)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'data/BundledData/**'
      - 'scripts/build-capacitor.sh'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No `cache: 'npm'` — that option requires a package-lock.json
          # to already exist in the repo to derive a cache key, and ours
          # is gitignored / generated fresh on each run. Skipping the
          # cache costs ~30s on first install; not worth the friction.

      # `npm ci` if there's a lock file (faster, reproducible);
      # otherwise fall back to `npm install` so the first run works
      # before we've committed a lock.
      - name: Install JS deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Compose the Capacitor webDir (`dist/`) by combining the
      # static frontend with the BundledData payload. Capacitor reads
      # from this directory, so the IPA ships with all sprites, low-
      # zoom tiles, fonts, icons, and species metadata baked in.
      - name: Build Capacitor webDir
        run: bash scripts/build-capacitor.sh

      # Patch Capacitor's iOS framework with two changes that make
      # bundled assets accessible cross-origin to the page (which
      # loads from server.url = poke.phylliidaassets.org):
      #
      # 1. WebViewAssetHandler.swift — set permissive
      #    `Access-Control-Allow-Origin: *` on every response. The
      #    stock behaviour only sets ACAO when serverUrl scheme
      #    differs from request scheme, AND uses
      #    serverUrl.absoluteString as the value — strict-match CORS
      #    that's been failing in our setup with "Load failed".
      #
      # 2. CAPBridgeViewController.swift — inject a WKUserScript
      #    that sets `window.CC_BUNDLED_DATA_BASE` to a
      #    `_capacitor_file_/<bundle-path>/bundled-data` URL. That's
      #    the ONLY URL pattern the Capacitor URL handler serves
      #    when serverUrl is configured — generic webDir routing
      #    (`capacitor://localhost/bundled-data/X`) gets a 404. Our
      #    JS modules read CC_BUNDLED_DATA_BASE for every fetch, so
      #    overriding it here from native code redirects every
      #    bundled-asset request through the supported pattern.
      #
      # Patches node_modules BEFORE `cap add ios` runs `pod install`,
      # since Capacitor's pod uses :path => '../../node_modules/...'
      # and CocoaPods compiles directly from that source tree.
      - name: Patch Capacitor framework (CORS + bundle URL injection)
        run: |
          set -e
          CAPDIR=node_modules/@capacitor/ios/Capacitor/Capacitor
          HANDLER=$CAPDIR/WebViewAssetHandler.swift
          BRIDGEVC=$CAPDIR/CAPBridgeViewController.swift
          for f in "$HANDLER" "$BRIDGEVC"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f not found" >&2
              find node_modules/@capacitor/ios -name "*.swift" | head -10 >&2
              exit 1
            fi
          done
          python3 - <<'PY'
          import sys, pathlib

          # ── Patch 1: WebViewAssetHandler — universal CORS ──
          handler = pathlib.Path("node_modules/@capacitor/ios/Capacitor/Capacitor/WebViewAssetHandler.swift")
          src = handler.read_text()
          old_headers = (
              'var headers =  [\n'
              '                "Content-Type": mimeType,\n'
              '                "Cache-Control": "no-cache"\n'
              '            ]'
          )
          new_headers = (
              'var headers =  [\n'
              '                "Content-Type": mimeType,\n'
              '                "Cache-Control": "no-cache",\n'
              '                "Access-Control-Allow-Origin": "*",\n'
              '                "Access-Control-Allow-Methods": "GET, HEAD, OPTIONS, TRACE",\n'
              '                "Access-Control-Allow-Headers": "*"\n'
              '            ]'
          )
          if old_headers not in src:
              print("ERROR: headers dict not found in WebViewAssetHandler.swift", file=sys.stderr)
              sys.exit(1)
          handler.write_text(src.replace(old_headers, new_headers, 1))
          print("CORS patch: ACAO=* applied to WebViewAssetHandler.swift")

          # ── Patch 2: CAPBridgeViewController — inject CC_BUNDLED_DATA_BASE ──
          bridgevc = pathlib.Path("node_modules/@capacitor/ios/Capacitor/Capacitor/CAPBridgeViewController.swift")
          src = bridgevc.read_text()
          # Anchor: the line that wires up the user content controller.
          # Insert the injection block right after it so the script is
          # registered before the page begins loading.
          anchor = "webConfig.userContentController = delegationHandler.contentController"
          insertion = anchor + (
              '\n        // [creature-collect patch] Inject\n'
              '        // window.CC_BUNDLED_DATA_BASE pointing at the IPA-bundled\n'
              '        // webDir contents via Capacitor\'s _capacitor_file_ URL\n'
              '        // pattern. That is the only path WebViewAssetHandler serves\n'
              '        // when serverURL is set. Page-side modules (sprites.js,\n'
              '        // species.js, appdata.js) read this constant for every\n'
              '        // fetch — overriding it here from native code transparently\n'
              '        // routes them through the supported pattern.\n'
              '        if let bundlePath = Bundle.main.path(forResource: "public", ofType: nil) {\n'
              '            let scheme = configuration.localURL.scheme ?? InstanceDescriptorDefaults.scheme\n'
              '            let host = configuration.localURL.host ?? InstanceDescriptorDefaults.hostname\n'
              '            let url = "\\(scheme)://\\(host)/_capacitor_file_\\(bundlePath)/bundled-data"\n'
              '            let escapedUrl = url\n'
              '                .replacingOccurrences(of: "\\\\", with: "\\\\\\\\")\n'
              '                .replacingOccurrences(of: "\\\'", with: "\\\\\\\'")\n'
              '            let script = "window.CC_BUNDLED_DATA_BASE = \\\'\\(escapedUrl)\\\';"\n'
              '            let userScript = WKUserScript(source: script, injectionTime: .atDocumentStart, forMainFrameOnly: true)\n'
              '            delegationHandler.contentController.addUserScript(userScript)\n'
              '        }'
          )
          if anchor not in src:
              print("ERROR: anchor not found in CAPBridgeViewController.swift", file=sys.stderr)
              sys.exit(1)
          if src.count(anchor) > 1:
              print(f"ERROR: anchor matches {src.count(anchor)} times — too ambiguous", file=sys.stderr)
              sys.exit(1)
          bridgevc.write_text(src.replace(anchor, insertion, 1))
          print("Bundle-URL injection patch applied to CAPBridgeViewController.swift")
          PY

      # The ios/ directory is gitignored — generate it fresh from
      # capacitor.config.json on every build. Idempotent: if it
      # already existed (cached?) cap add re-uses; otherwise it
      # scaffolds a clean Xcode project.
      - name: Add iOS platform
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios

      # Patch Info.plist with two iOS-required keys:
      #
      # 1. WKAppBoundDomains — iOS WKWebView only exposes
      #    `navigator.serviceWorker` for documents whose origin
      #    matches an entry here. In bundled mode the page is
      #    served from `capacitor://localhost`, so we need
      #    "localhost" in the list. (When we previously used
      #    `server.url`, the entry was `poke.phylliidaassets.org`
      #    instead — different mode, different domain.) Combined
      #    with `limitsNavigationsToAppBoundDomains: true` in
      #    capacitor.config.json, this is what flips the SW API on.
      #
      # 2. NSLocationWhenInUseUsageDescription — required by
      #    @capacitor/geolocation. Without it the first
      #    getCurrentPosition call crashes with "missing usage
      #    description".
      - name: Patch Info.plist (App-Bound Domains + Location)
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :WKAppBoundDomains" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains:0 string localhost" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains:1 string poke.phylliidaassets.org" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSLocationWhenInUseUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Show your position on the map and detect nearby creatures while walking.'" "$PLIST"
          echo "── Info.plist after patching ──"
          /usr/libexec/PlistBuddy -c "Print :WKAppBoundDomains" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$PLIST"

      # Capacitor's iOS template uses CocoaPods; macos-14 runner has
      # cocoapods preinstalled. `pod install` produces the .xcworkspace
      # we hand to xcodebuild below. (cap sync ios above already runs
      # pod install once, but we re-run here to ensure the workspace
      # is fully populated for the xcodebuild step.)
      - name: pod install
        run: |
          cd ios/App
          pod install --repo-update

      # Unsigned Release build — the three CODE_SIGN_* overrides tell
      # xcodebuild to skip signing entirely (otherwise it tries to
      # find a developer certificate in the keychain and fails on a
      # fresh runner).
      - name: Build .app (unsigned)
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # Manual IPA assembly: an IPA is just a Zip with a Payload/
      # directory at the root containing the .app bundle. Skipping
      # xcodebuild's archive/export pipeline avoids the whole
      # provisioning-profile question for unsigned builds.
      - name: Package .app into .ipa
        run: |
          APP_PATH=$(find ios/App/build -name "App.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Could not find App.app under ios/App/build/"
            echo "Tree dump for debugging:"
            find ios/App/build -name "*.app" -type d
            exit 1
          fi
          echo "Found .app at: $APP_PATH"
          APP_DIR=$(dirname "$APP_PATH")
          cd "$APP_DIR"
          mkdir -p Payload
          cp -r App.app Payload/
          zip -qr "$GITHUB_WORKSPACE/CreatureCollect.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/CreatureCollect.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CreatureCollect-ipa
          path: CreatureCollect.ipa
          # Keep for two weeks — long enough for slow weekends, short
          # enough that the artifact storage stays small.
          retention-days: 14
          if-no-files-found: error
