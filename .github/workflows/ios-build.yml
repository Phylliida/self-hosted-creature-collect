# Build an unsigned iOS IPA on a free macOS runner. The output is
# uploaded as a workflow artifact you download to your Linux box,
# then sideload onto your iPhone via SideStore (or AltServer-Linux).
#
# Sideloading tools re-sign the IPA with your Apple ID at install
# time, so we don't need a paid Apple Developer account or any signing
# secrets in the repo. CODE_SIGNING_ALLOWED=NO + manual Payload/
# zipping gives us a fully unsigned IPA that SideStore is happy with.
#
# Trigger: manual (workflow_dispatch) so you control when builds
# happen — and a path-filtered push so deploys to main of relevant
# files build automatically. Adjust to taste.

name: Build iOS IPA (unsigned, for sideloading)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'data/BundledData/**'
      - 'data/UnicodeData/**'
      - 'scripts/build-capacitor.sh'
      - 'scripts/build-unicode-data.py'
      - 'ios-overrides/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No `cache: 'npm'` — that option requires a package-lock.json
          # to already exist in the repo to derive a cache key, and ours
          # is gitignored / generated fresh on each run. Skipping the
          # cache costs ~30s on first install; not worth the friction.

      # `npm ci` if there's a lock file (faster, reproducible);
      # otherwise fall back to `npm install` so the first run works
      # before we've committed a lock.
      - name: Install JS deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Compose the Capacitor webDir (`dist/`) by combining the
      # static frontend with the BundledData payload. Capacitor reads
      # from this directory, so the IPA ships with all sprites, low-
      # zoom tiles, fonts, icons, and species metadata baked in.
      - name: Build Capacitor webDir
        run: bash scripts/build-capacitor.sh

      # Precompile the vendored NamesList.txt into the keyboard extension's
      # compact, mmap-friendly dataset (blocks.json + chars.idx + names.blob).
      # These artifacts are copied into the appex's resources further below.
      - name: Build Unicode keyboard data
        run: python3 scripts/build-unicode-data.py

      # The ios/ directory is gitignored — generate it fresh from
      # capacitor.config.json on every build. Idempotent: if it
      # already existed (cached?) cap add re-uses; otherwise it
      # scaffolds a clean Xcode project.
      - name: Add iOS platform
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
          # `cap sync` drops directories named `icons/` and `fonts/`
          # at every depth in the webDir copy — historical Capacitor
          # iOS sync behavior tied to app-icon / font asset conflicts.
          # Symptom: bundled-data/icons/*.svg and bundled-data/fonts/
          # are missing in App.app/public/, so LocalServer 404s POI
          # icons and MapLibre fonts. Sprites and tiles survive.
          # Forcibly re-copy dist/ over public/ via rsync to restore
          # what cap sync stripped. cordova.js / cordova_plugins.js
          # (added by cap sync, not in dist/) are preserved because
          # rsync without --delete only adds/overwrites.
          echo "── re-syncing dist/ → ios/App/App/public/ ──"
          rsync -a dist/ ios/App/App/public/
          echo "  immediate verify after rsync:"
          for d in icons fonts sprites; do
            n=$(find "ios/App/App/public/bundled-data/$d" -type f 2>/dev/null | wc -l)
            echo "    bundled-data/$d: $n files"
          done
      - name: Debug — public folder after cap sync
        run: |
          echo "── ios/App/App/public top level ──"
          ls -la ios/App/App/public/ | head -20
          echo "── ios/App/App/public/bundled-data top level ──"
          ls -la ios/App/App/public/bundled-data/ | head -20
          echo "── file counts per subdir ──"
          for d in icons fonts sprites tiles; do
            n=$(find "ios/App/App/public/bundled-data/$d" -type f 2>/dev/null | wc -l)
            echo "  bundled-data/$d: $n files"
          done
          for d in icons fonts tiles; do
            n=$(find "ios/App/App/public/$d" -type f 2>/dev/null | wc -l)
            echo "  /$d (alias): $n files"
          done
          echo "── all .svg files under public ──"
          find ios/App/App/public -name "*.svg" | head -20
          echo "  total .svg: $(find ios/App/App/public -name "*.svg" | wc -l)"

      # Wire in the local HTTP-server architecture. Why: Apple gates
      # `navigator.serviceWorker.register()` behind an HTTP/HTTPS
      # scheme + secure context. Custom schemes like `capacitor://`
      # don't qualify, so SW silently rejects in pure-bundled mode.
      # We bypass by embedding GCDWebServer (Objective-C, well-tested
      # CocoaPod) and pointing the WebView at `http://localhost:<port>`
      # — Apple treats localhost as potentially trustworthy regardless
      # of HTTPS, so SW works AND every fetch is same-origin (no CORS
      # gymnastics for bundled assets).
      #
      # ios-overrides/LocalServer.swift   — GCDWebServer wrapper that
      #   serves files from App.app/public/ with an optional liveDir
      #   override (for live-update flow).
      # ios-overrides/AppBridgeViewController.swift — CAPBridgeViewController
      #   subclass; in instanceDescriptor() it boots LocalServer and
      #   sets descriptor.serverURL to the http://localhost:<port>/ URL.
      # ios-overrides/inject-into-xcodeproj.rb — adds both Swift files
      #   to the App target so xcodebuild compiles them.
      - name: Inject local-server Swift files + Podfile entry
        run: |
          set -e
          # Copy Swift overrides into the freshly-scaffolded iOS project.
          cp ios-overrides/LocalServer.swift             ios/App/App/LocalServer.swift
          cp ios-overrides/AppBridgeViewController.swift ios/App/App/AppBridgeViewController.swift
          cp ios-overrides/BundleAccessPlugin.swift      ios/App/App/BundleAccessPlugin.swift
          cp ios-overrides/MemoryProbePlugin.swift       ios/App/App/MemoryProbePlugin.swift
          cp ios-overrides/LocalServerDiagPlugin.swift   ios/App/App/LocalServerDiagPlugin.swift
          cp ios-overrides/MotionPedometerPlugin.swift   ios/App/App/MotionPedometerPlugin.swift
          cp ios-overrides/HapticPatternPlugin.swift     ios/App/App/HapticPatternPlugin.swift

          # Point Main.storyboard at our subclass instead of stock CAPBridgeViewController.
          STORYBOARD=ios/App/App/Base.lproj/Main.storyboard
          # macos `sed -i` requires '' for in-place. Match the customClass + customModule pair.
          sed -i '' \
            -e 's|customClass="CAPBridgeViewController" customModule="Capacitor"|customClass="AppBridgeViewController"|' \
            "$STORYBOARD"
          echo "── storyboard after patching ──"
          grep -E 'customClass=' "$STORYBOARD" || true

          # Add GCDWebServer pod to the Capacitor-generated Podfile.
          # Inserted before the `target 'App' do` block ends. Idempotent.
          PODFILE=ios/App/Podfile
          if ! grep -q "pod 'GCDWebServer'" "$PODFILE"; then
            python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("ios/App/Podfile")
          src = p.read_text()
          # Insert inside the `target 'App' do ... end` block, right before the matching `end`.
          # Use a non-greedy match for the block body.
          m = re.search(r"(target ['\"]App['\"] do\b.*?)(\n\s*end\b)", src, re.DOTALL)
          if not m:
              raise SystemExit("ERROR: target 'App' do … end block not found in Podfile")
          insertion = "\n  pod 'GCDWebServer', '~> 3.5'"
          src = src[:m.end(1)] + insertion + src[m.end(1):]
          p.write_text(src)
          print("Added GCDWebServer pod to Podfile")
          PY
          else
            echo "GCDWebServer already in Podfile"
          fi

          # Copy the custom-keyboard extension sources + precompiled Unicode
          # data into the freshly-scaffolded iOS project. inject-into-xcodeproj.rb
          # (below) creates the UnicodeKeyboard app-extension target from these.
          mkdir -p ios/App/App/UnicodeKeyboard/UnicodeData
          cp ios-overrides/keyboard/KeyboardViewController.swift ios/App/App/UnicodeKeyboard/
          cp ios-overrides/keyboard/UnicodeStore.swift           ios/App/App/UnicodeKeyboard/
          cp ios-overrides/keyboard/RecentsStore.swift           ios/App/App/UnicodeKeyboard/
          cp ios-overrides/keyboard/SearchKeyboardView.swift     ios/App/App/UnicodeKeyboard/
          cp ios-overrides/keyboard/Info.plist                   ios/App/App/UnicodeKeyboard/Info.plist
          cp data/UnicodeData/blocks.json data/UnicodeData/chars.idx data/UnicodeData/names.blob \
             ios/App/App/UnicodeKeyboard/UnicodeData/

          # Add Swift files to App.xcodeproj. xcodeproj gem ships with CocoaPods.
          ruby ios-overrides/inject-into-xcodeproj.rb

      # Patch Info.plist:
      #
      # 1. WKAppBoundDomains — needed for SW registration in WKWebView.
      #    Page now loads from http://localhost:<port>, so add
      #    "localhost" as an app-bound domain. Combined with
      #    `limitsNavigationsToAppBoundDomains: true` this exposes the
      #    SW API.
      #
      # 2. NSLocationWhenInUseUsageDescription — required by
      #    @capacitor/geolocation; first call crashes without it.
      - name: Patch Info.plist (App-Bound Domains + Location)
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :WKAppBoundDomains" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains:0 string localhost" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSLocationWhenInUseUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Show your position on the map and detect nearby creatures while walking.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSMotionUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMotionUsageDescription string 'Credit your daycare creatures and incubating eggs with steps walked while the app is closed.'" "$PLIST"
          echo "── Info.plist after patching ──"
          /usr/libexec/PlistBuddy -c "Print :WKAppBoundDomains" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSMotionUsageDescription" "$PLIST"

      # Re-run pod install so the GCDWebServer pod is actually
      # downloaded and the App.xcworkspace is regenerated. (cap sync
      # already ran pod install once before our Podfile edit.)
      - name: pod install (with GCDWebServer)
        run: |
          cd ios/App
          pod install --repo-update

      # Unsigned Release build — the three CODE_SIGN_* overrides tell
      # xcodebuild to skip signing entirely (otherwise it tries to
      # find a developer certificate in the keychain and fails on a
      # fresh runner).
      - name: Build .app (unsigned)
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # Debug: report what survived xcodebuild into App.app/public/.
      # If something is in ios/App/App/public/<x>/ at sync time but
      # not in App.app/public/<x>/ at build time, xcodebuild's resource
      # processing dropped it.
      - name: Debug — App.app contents after xcodebuild
        run: |
          APP_PATH=$(find ios/App/build -name "App.app" -type d | head -1)
          echo "App.app: $APP_PATH"
          if [ -z "$APP_PATH" ]; then exit 0; fi
          echo "── App.app/public top level ──"
          ls -la "$APP_PATH/public/" | head -20
          echo "── App.app/public/bundled-data ──"
          ls -la "$APP_PATH/public/bundled-data/" 2>/dev/null | head -20
          echo "── file counts per subdir in App.app/public/bundled-data ──"
          for d in icons fonts sprites tiles; do
            n=$(find "$APP_PATH/public/bundled-data/$d" -type f 2>/dev/null | wc -l)
            echo "  bundled-data/$d: $n files"
          done
          for d in icons fonts tiles; do
            n=$(find "$APP_PATH/public/$d" -type f 2>/dev/null | wc -l)
            echo "  /$d (alias): $n files"
          done
          echo "── all .svg files in App.app ──"
          find "$APP_PATH" -name "*.svg" | head -20
          echo "  total .svg: $(find "$APP_PATH" -name "*.svg" | wc -l)"

      # Manual IPA assembly: an IPA is just a Zip with a Payload/
      # directory at the root containing the .app bundle. Skipping
      # xcodebuild's archive/export pipeline avoids the whole
      # provisioning-profile question for unsigned builds.
      - name: Package .app into .ipa
        run: |
          APP_PATH=$(find ios/App/build -name "App.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Could not find App.app under ios/App/build/"
            echo "Tree dump for debugging:"
            find ios/App/build -name "*.app" -type d
            exit 1
          fi
          echo "Found .app at: $APP_PATH"
          APP_DIR=$(dirname "$APP_PATH")
          cd "$APP_DIR"
          mkdir -p Payload
          cp -r App.app Payload/
          zip -qr "$GITHUB_WORKSPACE/CreatureCollect.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/CreatureCollect.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CreatureCollect-ipa
          path: CreatureCollect.ipa
          # Keep for two weeks — long enough for slow weekends, short
          # enough that the artifact storage stays small.
          retention-days: 14
          if-no-files-found: error
