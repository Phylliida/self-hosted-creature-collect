<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pixel Art</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e0f13'/%3E%3Crect x='9' y='9' width='6' height='6' fill='%23ff004d'/%3E%3Crect x='17' y='9' width='6' height='6' fill='%23ffec27'/%3E%3Crect x='9' y='17' width='6' height='6' fill='%2329adff'/%3E%3Crect x='17' y='17' width='6' height='6' fill='%2300e436'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #14151a; --panel: #1c1d24; --panel2: #24262f;
      --line: rgba(255,255,255,0.10); --text: #e9e9ee; --muted: #9a9aa6;
      --accent: #5b8cff;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden;
      touch-action: none; -webkit-user-select: none; user-select: none; }
    #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
    #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
    #px { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    /* Bottom toolbar — two rows, dark minimal, matches the extras window. */
    #bar { flex: none; background: rgba(0,0,0,0.55); border-top: 1px solid var(--line);
      padding: 7px max(8px, env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-right));
      display: flex; flex-direction: column; gap: 7px; }
    .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .grow { flex: 1 1 auto; }
    button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
      border-radius: 8px; cursor: pointer; padding: 7px 10px; line-height: 1; }
    button:hover { background: var(--panel2); }
    .iconbtn { width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
    .iconbtn svg { display: block; width: 20px; height: 20px; }
    .tool.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    #zoom button { width: 34px; height: 34px; padding: 0; font-size: 17px; }
    #zoomLabel { color: var(--muted); font-size: 12px; min-width: 40px; text-align: center; }

    /* Palette */
    #palette { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
    .swatch { width: 26px; height: 26px; border-radius: 6px; border: 2px solid transparent;
      cursor: pointer; padding: 0; background-clip: padding-box; }
    .swatch.active { border-color: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.6); }
    /* Checkerboard behind the live/active color chip so transparency reads. */
    #curColor { width: 30px; height: 30px; border-radius: 7px; border: 2px solid var(--line); flex: none;
      background-image: linear-gradient(45deg,#888 25%,transparent 25%),linear-gradient(-45deg,#888 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#888 75%),linear-gradient(-45deg,transparent 75%,#888 75%);
      background-size: 10px 10px; background-position: 0 0,0 5px,5px -5px,-5px 0; }
    #curColorTop { width: 100%; height: 100%; border-radius: 5px; }
    label.colorpick { position: relative; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--panel); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; }
    label.colorpick span { font-size: 19px; color: var(--muted); line-height: 1; }
    label.colorpick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    /* Reference-image opacity row (shown only when a reference is loaded) */
    #refRow { border-top: 1px solid var(--line); padding-top: 8px; }
    .reflabel { color: var(--muted); font-size: 12px; flex: none; }
    #refOpacity { accent-color: var(--accent); height: 24px; min-width: 80px; }
    #refOpacityVal { color: var(--muted); font-size: 12px; flex: none; min-width: 38px; text-align: right; }
    #refBtn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* New-art dialog */
    .overlay { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.6); }
    .overlay.show { display: flex; }
    .card { width: min(330px, 90vw); background: var(--panel); border: 1px solid var(--line);
      border-radius: 14px; padding: 18px; box-shadow: 0 14px 40px rgba(0,0,0,0.5); }
    .card h3 { margin: 0 0 14px; font-size: 16px; text-align: center; font-weight: 600; }
    .dims { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin-bottom: 12px; }
    .dims label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
    .dims span { padding-bottom: 9px; color: var(--muted); }
    .dims input { width: 78px; padding: 9px 8px; font-size: 16px; text-align: center; color: var(--text);
      background: #101116; border: 1px solid var(--line); border-radius: 8px; }
    .presets { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; }
    .presets button { flex: 1; padding: 7px 0; font-size: 13px; }
    .card .actions { display: flex; gap: 8px; }
    .card .actions button { flex: 1; padding: 10px; text-align: center; }
    .card .actions .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .hint { margin: -4px 0 12px; text-align: center; font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage"><canvas id="px"></canvas></div>
    <div id="bar">
      <div class="row">
        <div id="tools" class="row" style="gap:5px">
          <button class="iconbtn tool active" data-tool="pencil" title="Pencil (B)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg></button>
          <button class="iconbtn tool" data-tool="eraser" title="Eraser (E)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14l6-6 8 8-4 4H8z"/><path d="M14 18h6"/></svg></button>
          <button class="iconbtn tool" data-tool="fill" title="Fill (G)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11l6-6 7 7-6 6a2 2 0 0 1-3 0l-4-4a2 2 0 0 1 0-3z"/><path d="M11 5 9 3"/><path d="M19 15s2 2 2 3.5A2 2 0 0 1 19 20a2 2 0 0 1-2-1.5C17 17 19 15 19 15z"/></svg></button>
          <button class="iconbtn tool" data-tool="eyedropper" title="Pick colour (I)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 3a2.1 2.1 0 0 1 3 3l-8 8-3 1 1-3z"/><path d="M13 7 5 15a2 2 0 0 0 0 3l1 1a2 2 0 0 0 3 0l8-8"/></svg></button>
          <button class="iconbtn tool" data-tool="line" title="Line (L)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5"/></svg></button>
          <button class="iconbtn tool" data-tool="rect" title="Rectangle (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
          <button class="iconbtn tool" data-tool="pan" title="Pan (H / two fingers)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V12m0-1a1.5 1.5 0 0 1 3 0v4a5 5 0 0 1-5 5h-2a5 5 0 0 1-4-2l-3-4s-1-1.5.3-2.3 2.2.8 2.2.8L9 13"/></svg></button>
        </div>
        <span class="grow"></span>
        <div id="zoom" class="row" style="gap:4px">
          <button id="zoomOut" title="Zoom out">&minus;</button>
          <span id="zoomLabel">100%</span>
          <button id="zoomIn" title="Zoom in">+</button>
          <button id="zoomFit" class="iconbtn" title="Fit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        </div>
        <button id="exportBtn" class="iconbtn" title="Export PNG (transparent)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="M8 10l4 4 4-4"/><path d="M4 20h16"/></svg></button>
        <button id="refBtn" class="iconbtn" title="Reference image — trace behind the pixels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5L5 20"/></svg></button>
        <input type="file" id="refFile" accept="image/*" hidden>
      </div>
      <div class="row">
        <div id="curColor"><div id="curColorTop"></div></div>
        <div id="palette" class="grow"></div>
        <label class="colorpick" title="Custom colour"><span>+</span><input type="color" id="colorInput" value="#5b8cff"></label>
      </div>
      <div id="refRow" class="row" style="display:none">
        <span class="reflabel">Reference</span>
        <input type="range" id="refOpacity" class="grow" min="0" max="100" value="50" title="Reference opacity">
        <span id="refOpacityVal">50%</span>
        <button id="refRemove" class="iconbtn" title="Remove reference">&times;</button>
      </div>
    </div>
  </div>

  <div id="newDialog" class="overlay">
    <div class="card">
      <h3>New pixel art</h3>
      <div class="dims">
        <label>Width<input type="number" id="newW" min="1" max="256" value="16" inputmode="numeric"></label>
        <span>×</span>
        <label>Height<input type="number" id="newH" min="1" max="256" value="16" inputmode="numeric"></label>
      </div>
      <div class="hint">1–256 per side</div>
      <div class="presets">
        <button data-preset="8">8²</button>
        <button data-preset="16">16²</button>
        <button data-preset="32">32²</button>
        <button data-preset="64">64²</button>
      </div>
      <div class="actions">
        <button id="newCancel">Cancel</button>
        <button id="newCreate" class="primary">Create</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
