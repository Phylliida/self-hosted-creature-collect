<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Isomorphic Sound Canvas – 3 Rows of Percussion</title>

<style>
/* ------------ GLOBAL LAYOUT ------------ */
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;
user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#soundPad{width:100%;height:100%;background:linear-gradient(135deg,#1e3c72,#2a5298);touch-action:none;position:relative}

/* ----- percussion guide overlay ----- */
#drumGrid{position:absolute;inset:0;pointer-events:none;display:none}
.drum-v{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.35)}
.drum-h{position:absolute;left:0;right:0;height:2px;background:rgba(255,255,255,.35)}

/* ------------ NOTE MARKERS ------------ */
.note-marker,.playback-marker{position:absolute;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:bold}
.note-marker{box-shadow:0 0 15px rgba(255,255,255,.6);color:#fff}
.playback-marker{box-shadow:0 0 7px rgba(255,255,0,.8);border:2px solid rgba(255,255,0,.8);
background:rgba(255,255,0,.25);color:#ffc}

/* ------------ BOTTOM STACK (dots / scrubber / controls) ------------ */
#bottomStack{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;flex-direction:column}
#scrubRow{display:flex;background:rgba(0,0,0,.5);padding:0 8px}
#scrubSlider{width:100%;height:18px;margin:0}

/* ------------ COMPACT CONTROL STRIP ------------ */
#controls{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;
padding:4px 6px;background:rgba(0,0,0,.55);backdrop-filter:blur(5px);font-size:12px}
.control-group{display:flex;align-items:center;background:rgba(0,0,0,.2);padding:3px 6px;border-radius:4px;gap:6px}
button{padding:5px 9px;background:rgba(255,255,255,.18);border:none;border-radius:4px;color:#fff;font-weight:600;cursor:pointer;
transition:.2s;font-size:12px}
button:hover{background:rgba(255,255,255,.28)}
button.active{background:rgba(255,100,100,.55)}
label,.control-value{color:#fff}
input[type=range]{width:80px;height:6px}

/* ------------ PANELS / METRONOME ------------ */
#recordingsToggle{position:fixed;top:10px;right:10px;z-index:101;padding:4px 9px;background:rgba(0,0,0,.5);
color:#fff;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:4px;font-size:13px}
#recordingsPanel{position:fixed;top:42px;right:10px;width:180px;max-height:40vh;background:rgba(0,0,0,.78);
backdrop-filter:blur(5px);z-index:100;padding:8px;border-radius:4px;overflow-y:auto;display:none;flex-direction:column;gap:5px}
#recordingsPanel.visible{display:flex}
.recording-item{display:flex;align-items:center;flex-wrap:wrap;padding:5px;background:rgba(255,255,255,.1);border-radius:4px;transition:.2s}
.rec-vol{flex-basis:100%;width:100%;height:4px;margin:5px 0 1px}
.recording-item.active{background:rgba(255,100,100,.28)}
.recording-name{flex-grow:1;color:#fff;margin-right:4px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recording-controls{display:flex;gap:3px}
.recording-controls button{padding:2px 5px;font-size:10px;min-width:20px}
#recordingBadge{position:fixed;top:14px;right:60px;background:rgba(255,0,0,.55);color:#fff;border-radius:10px;font-size:11px;
padding:1px 6px;display:none;z-index:101}
.recording-badge.visible{display:block}
#metronomeLight{width:12px;height:12px;border-radius:50%;background:#333;transition:.1s}
#metronomeLight.active{background:#ff5;box-shadow:0 0 9px #ff5}
#barCounter{color:#fff;min-width:34px;text-align:center}
.beat-indicator{background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;gap:4px;padding:5px 6px}
.beat-marker{flex:0 1 14px;min-width:5px;aspect-ratio:1;height:auto;background:rgba(255,255,255,.2);border-radius:50%;transition:.05s}
.beat-marker.accent{flex-basis:18px;background:rgba(255,255,255,.28)}
.beat-marker.active{background:rgba(255,255,0,.85);box-shadow:0 0 9px rgba(255,255,0,.55)}

/* ----- quantize: scale pitch-line overlay + hex keyboard ----- */
#scaleGrid,#scaleLabels,#hexGrid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none}
.scale-label{position:absolute;transform:translate(-50%,-50%);font-size:9px;font-weight:bold;pointer-events:none;
text-shadow:0 0 3px rgba(0,0,0,.9)}
select{padding:4px 5px;background:rgba(255,255,255,.18);border:none;border-radius:4px;color:#fff;font-size:12px}
select option{color:#000}

/* ----- synth options popover (low note / hex key size) ----- */
#synthCfgPanel{position:fixed;right:10px;bottom:120px;z-index:101;background:rgba(0,0,0,.78);
backdrop-filter:blur(5px);padding:10px 12px;border-radius:8px;display:flex;flex-direction:column;gap:8px;
font-size:12px;color:#fff;min-width:170px}
#synthCfgPanel[hidden]{display:none}
#synthCfgPanel label{display:flex;justify-content:space-between;gap:10px;align-items:center;color:#fff}

/* ----- ⚗ voice lab: docked top sheet ("tab") — keys below stay playable ----- */
#labToggle{position:fixed;top:10px;left:10px;z-index:105;padding:4px 9px;background:rgba(0,0,0,.5);
color:#fff;border-radius:4px;cursor:pointer;font-size:13px}
#voiceLabPanel{position:fixed;top:0;left:0;right:0;max-height:calc(100% - 6px);z-index:104;overflow:hidden;
background:rgba(8,12,24,.93);backdrop-filter:blur(6px);padding:10px 14px 12px;
border-radius:0 0 14px 14px;display:flex;gap:10px;font-size:12px;color:#fff}
#voiceLabPanel[hidden]{display:none}
#vlMain{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:7px;overflow-y:auto}
#vlPadCol{display:flex;flex-direction:column;gap:6px;flex-shrink:0;width:54px}
#vlPadCol select{width:54px;padding:4px 2px;text-align:center}
#vlPad{flex:1;min-height:120px;border-radius:10px;position:relative;cursor:pointer;
background:linear-gradient(180deg,#2a5298,#1e3c72);touch-action:none;box-shadow:inset 0 0 10px rgba(0,0,0,.35)}
#vlPadNote{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;
color:rgba(255,255,255,.85);font-size:11px;font-weight:600;text-shadow:0 0 4px #000;white-space:nowrap}
#voiceLabPanel label{display:flex;justify-content:space-between;gap:8px;align-items:center;color:#fff}
#voiceLabPanel input[type=range]{width:46%;max-width:220px}
#voiceLabPanel .vl-v{min-width:44px;text-align:right;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums}
#voiceLabPanel .vl-title{text-align:center;font-weight:700;margin-bottom:2px;position:relative}
#voiceLabPanel .vl-h{font-size:10px;letter-spacing:.14em;text-transform:uppercase;
color:rgba(160,190,255,.75);margin:3px 0 -2px}
#vlClose{position:absolute;right:0;top:-3px;padding:2px 9px}
#vlMatch.on{background:rgba(120,180,255,.4)}
#vlSpec{width:100%;height:104px;border-radius:6px;background:rgba(255,255,255,.05);flex-shrink:0}
.vl-librow{display:flex;gap:6px;margin-top:2px}
#vlName{flex:1;min-width:0;padding:5px 8px;border:none;border-radius:4px;background:rgba(255,255,255,.14);
color:#fff;font-size:12px}
#vlList,#vlPresets{display:flex;flex-wrap:wrap;gap:5px}
.vl-preset{border-radius:999px;padding:4px 11px;background:rgba(255,255,255,.09)}
.vl-vrow{display:flex;align-items:center;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden}
.vl-pick{border-radius:999px 0 0 999px;padding:4px 4px 4px 11px}
.vl-pick.on{background:rgba(120,180,255,.4)}
.vl-del{padding:4px 9px 4px 5px;background:transparent}

/* ----- 🌐 tuning explorer (Scala archive browser) ----- */
#tunExplorer{position:fixed;inset:0;z-index:200;background:#070b18;
display:flex;flex-direction:column;color:#fff;font-size:12px;padding:10px 10px 4px}
#tunExplorer[hidden]{display:none}
.tx-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-shrink:0}
.tx-title{font-weight:700;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#txCount{color:rgba(160,190,255,.8);font-weight:400;font-size:11px;margin-left:7px}
#txHisto{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;overflow-y:hidden;
padding:2px 2px 0;flex-shrink:0;scrollbar-width:none}
.tx-bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;
padding:2px 3px 3px;background:transparent;border-radius:6px;min-width:22px;flex-shrink:0}
.tx-bar i{display:block;width:15px;border-radius:3px 3px 1px 1px;min-height:3px}
.tx-bar b{font-size:9px;font-weight:600;color:rgba(255,255,255,.75);line-height:1}
.tx-bar u{font-size:8px;text-decoration:none;color:rgba(255,255,255,.38);line-height:1}
.tx-bar.on{background:rgba(120,180,255,.26)}
.tx-bar.on b{color:#fff}
#txChipRow{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0;flex-shrink:0;align-items:center}
#txChips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tx-sel{font-size:11px;padding:3px 6px;border-radius:999px;background:rgba(255,255,255,.1);max-width:44vw}
#txDetRuler{border-radius:6px;background:rgba(255,255,255,.05)}
#txSearch{flex:1;min-width:90px;padding:4px 9px;border:none;border-radius:999px;
background:rgba(255,255,255,.1);color:#fff;font-size:11px}
#txGrid{flex:1;min-height:0;overflow-y:auto;position:relative;border-radius:8px;background:rgba(255,255,255,.03)}
#txPad{position:relative;width:100%}
.tx-cell{position:absolute;display:flex;flex-direction:column;align-items:center;gap:1px;
cursor:pointer;padding-top:6px;border-radius:8px}
.tx-cell:active{background:rgba(120,180,255,.15)}
.tx-name{font-size:9px;color:rgba(255,255,255,.72);max-width:94%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#txStatus{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;
justify-content:center;color:rgba(255,255,255,.75);text-align:center;padding:14px}
#txDetail{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;
gap:7px;padding:10px 8px}
#txDetail[hidden]{display:none}
#txDetName{font-weight:700;font-size:15px;text-align:center;overflow-wrap:anywhere}
#txDetMeta{color:rgba(160,190,255,.85)}
#txDetDesc{text-align:center;max-width:480px;color:rgba(255,255,255,.85);line-height:1.45}
#txDetCents{font-size:10px;color:rgba(160,190,255,.8);max-width:520px;text-align:center;line-height:1.6;
font-variant-numeric:tabular-nums}
.tx-actions{display:flex;gap:8px;margin-top:2px;flex-wrap:wrap;justify-content:center}
#txUse{background:rgba(120,180,255,.4)}
.tx-credit{flex-shrink:0;text-align:center;font-size:9px;color:rgba(255,255,255,.32);padding:4px 0 2px}
</style>
</head>
<body>
<!-- ---------- MAIN CANVAS ---------- -->
<div id="soundPad"><div id="drumGrid"></div>
<svg id="scaleGrid" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
<div id="scaleLabels"></div>
<canvas id="hexGrid"></canvas></div>

<!-- ---------- SYNTH OPTIONS POPOVER ---------- -->
<div id="synthCfgPanel" hidden>
  <label>Voice
    <select id="voiceSel"></select>
  </label>
  <button id="voiceLabBtn">⚗ Voice Lab…</button>
  <button id="tunExplorerBtn">🌐 Tuning Explorer…</button>
  <label>Low note
    <select id="baseOctSel">
      <option value="1">C1 · deep</option><option value="2">C2</option><option value="3">C3</option>
      <option value="4">C4</option><option value="5">C5 · high</option>
    </select>
  </label>
  <label>Hex key size
    <select id="hexSizeSel">
      <option value="0.8">Small</option><option value="1">Normal</option>
      <option value="1.3">Large</option><option value="1.6">Huge</option>
    </select>
  </label>
  <label>Edge margin
    <select id="edgeInsetSel">
      <option value="0">Off</option><option value="24">Small</option><option value="40">Big</option>
    </select>
  </label>
  <label>Hex step →
    <select id="hexEastSel"></select>
  </label>
  <label>Hex step ↗
    <select id="hexNESel"></select>
  </label>
  <label>Loop measures
    <select id="barsSel">
      <option value="1">1</option><option value="2">2</option><option value="4">4</option>
      <option value="8">8</option><option value="12">12</option><option value="16">16</option>
    </select>
  </label>
  <label>Beats / measure
    <select id="timeSigSel">
      <option value="2">2</option><option value="3">3</option><option value="4">4</option>
      <option value="5">5</option><option value="6">6</option><option value="7">7</option>
      <option value="8">8</option><option value="9">9</option>
    </select>
  </label>
</div>

<!-- ---------- ⚗ VOICE LAB TAB ---------- -->
<div id="labToggle">⚗ Lab</div>
<div id="voiceLabPanel" hidden>
<div id="vlMain">
  <div class="vl-title">⚗ Voice Lab<button id="vlClose">×</button></div>
  <canvas id="vlSpec"></canvas>
  <div class="vl-h">Source — what vibrates</div>
  <label>Partials <input type="range" id="vlCount" min="1" max="10" step="1"><span class="vl-v" id="vlCountV"></span></label>
  <label>Stretch <input type="range" id="vlStretch" min="-30" max="50" step="1"><span class="vl-v" id="vlStretchV"></span></label>
  <label>Tilt <input type="range" id="vlTilt" min="0" max="30" step="1"><span class="vl-v" id="vlTiltV"></span></label>
  <label>Sieve
    <select id="vlSieve">
      <option value="all">All</option><option value="odd">Odd</option>
      <option value="oct">Octaves</option><option value="3rd">Every 3rd</option>
    </select>
  </label>
  <label>Width <input type="range" id="vlWidth" min="0" max="25" step="1"><span class="vl-v" id="vlWidthV"></span></label>
  <label>Breath <input type="range" id="vlBreath" min="0" max="60" step="2"><span class="vl-v" id="vlBreathV"></span></label>
  <div class="vl-h">Body — what it resonates through</div>
  <label>Formant <input type="range" id="vlFormantF" min="200" max="4000" step="20"><span class="vl-v" id="vlFormantFV"></span></label>
  <label>Resonance <input type="range" id="vlFormantA" min="0" max="18" step="1"><span class="vl-v" id="vlFormantAV"></span></label>
  <div class="vl-h">Time — how it lives</div>
  <label>Attack <input type="range" id="vlAttack" min="0" max="30" step="1"><span class="vl-v" id="vlAttackV"></span></label>
  <label>Decay <input type="range" id="vlDecay" min="0" max="150" step="5"><span class="vl-v" id="vlDecayV"></span></label>
  <label>Damping <input type="range" id="vlDamping" min="0" max="100" step="5"><span class="vl-v" id="vlDampingV"></span></label>
  <label>Vibrato <input type="range" id="vlMotion" min="0" max="20" step="1"><span class="vl-v" id="vlMotionV"></span></label>
  <div class="vl-h">Strike — how it's excited</div>
  <label>Amount <input type="range" id="vlChiff" min="0" max="80" step="4"><span class="vl-v" id="vlChiffV"></span></label>
  <label>Color <input type="range" id="vlStrikeF" min="1" max="24" step="1"><span class="vl-v" id="vlStrikeFV"></span></label>
  <label>Time <input type="range" id="vlStrikeT" min="3" max="120" step="3"><span class="vl-v" id="vlStrikeTV"></span></label>
  <button id="vlMatch">✨ Match tuning</button>
  <button id="vlRandom">🎲 Randomize</button>
  <div class="vl-h">Presets</div>
  <div id="vlPresets"></div>
  <div class="vl-h">Your voices</div>
  <div class="vl-librow"><input id="vlName" placeholder="voice name" maxlength="24"><button id="vlSave">Save voice</button></div>
  <div id="vlList"></div>
</div>
<div id="vlPadCol">
  <select id="vlPadOct" title="strip bottom note">
    <option value="1">C1</option><option value="2">C2</option><option value="3">C3</option>
    <option value="4">C4</option><option value="5">C5</option><option value="6">C6</option>
  </select>
  <div id="vlPad"><span id="vlPadNote">♪</span></div>
</div>
</div>

<!-- ---------- 🌐 TUNING EXPLORER (Scala archive browser) ---------- -->
<div id="tunExplorer" hidden>
  <div class="tx-head">
    <span class="tx-title">🌐 Tunings<span id="txCount"></span></span>
    <button id="txRandom" title="surprise me">🎲</button>
    <button id="txClose">×</button>
  </div>
  <div id="txHisto"></div>
  <div id="txChipRow"><div id="txChips"></div><input id="txSearch" placeholder="search…"></div>
  <div id="txGrid"><div id="txPad"></div><div id="txStatus"></div></div>
  <div id="txDetail" hidden>
    <canvas id="txDetCanvas"></canvas>
    <canvas id="txDetRuler"></canvas>
    <div id="txDetName"></div>
    <div id="txDetMeta"></div>
    <div id="txDetDesc"></div>
    <div id="txDetCents"></div>
    <div class="tx-actions">
      <button id="txBack">← Back</button>
      <button id="txHear">▶ Hear it</button>
      <button id="txUse">✓ Use tuning</button>
    </div>
  </div>
  <div class="tx-credit">Scala scale archive © Manuel Op de Coul · huygens-fokker.org/scala</div>
</div>

<!-- ---------- RECORDINGS PANEL ---------- -->
<div id="recordingsToggle"><span>Recordings</span><span id="dropdownArrow">▼</span></div>
<div id="recordingBadge" class="recording-badge">0</div>
<div id="recordingsPanel"><div style="color:#fff;text-align:center;font-size:14px;margin-bottom:4px">Recordings</div><div id="metRow"></div><div id="recordingsList"></div></div>

<!-- ---------- BOTTOM STACK: beat dots / time scrubber / controls ---------- -->
<div id="bottomStack">
<div id="beatIndicator" class="beat-indicator"></div>
<div id="scrubRow"><input type="range" id="scrubSlider" min="0" max="32" step="0.01" value="0"></div>
<div id="controls">
  <div class="control-group"><label>Instr:</label><button id="instrumentBtn">Synth</button></div>
  <div class="control-group"><label>Scale</label>
    <select id="edoSel"></select>
    <select id="scaleSel"></select>
    <select id="rootSel"></select>
    <button id="synthCfgBtn" title="synth options">⚙</button>
  </div>
  <div class="control-group"><label>Tempo</label><input type="range" id="tempoSlider" min="40" max="200" value="120"><span id="tempoValue" class="control-value">120 BPM</span></div>
  <div class="control-group"><button id="metronomeBtn">Met:Off</button><div id="metronomeLight"></div><span id="barCounter">1.1</span></div>
  <div class="control-group"><button id="recordBtn">Rec</button><button id="playAllBtn">Play</button><button id="stopBtn">Stop</button></div>
</div>
</div>

<script>
document.addEventListener('DOMContentLoaded',()=>{

/* ==== DOM ==== */
const $=id=>document.getElementById(id);
const pad=$('soundPad'), grid=$('drumGrid'),
      tempoSlider=$('tempoSlider'), tempoValue=$('tempoValue'),
      metBtn=$('metronomeBtn'), metLight=$('metronomeLight'), barCounter=$('barCounter'),
      beatIndicator=$('beatIndicator'), recordBtn=$('recordBtn'), playBtn=$('playAllBtn'),
      stopBtn=$('stopBtn'), recToggle=$('recordingsToggle'),
      arrow=$('dropdownArrow'), recordingsPanel=$('recordingsPanel'), recordingsList=$('recordingsList'),
      badge=$('recordingBadge'), instBtn=$('instrumentBtn'),
      scaleSel=$('scaleSel'), rootSel=$('rootSel'), scaleGridEl=$('scaleGrid'),
      scaleLabels=$('scaleLabels'), scrubSlider=$('scrubSlider'),
      edoSel=$('edoSel'), hexCanvas=$('hexGrid'),
      synthCfgBtn=$('synthCfgBtn'), synthCfgPanel=$('synthCfgPanel'),
      baseOctSel=$('baseOctSel'), hexSizeSel=$('hexSizeSel'), edgeInsetSel=$('edgeInsetSel'),
      hexEastSel=$('hexEastSel'), hexNESel=$('hexNESel'),
      barsSel=$('barsSel'), timeSigSel=$('timeSigSel'), voiceSel=$('voiceSel'),
      voiceLabBtn=$('voiceLabBtn'), voiceLabPanel=$('voiceLabPanel'),
      vlSieve=$('vlSieve'), vlMatch=$('vlMatch'), vlSpec=$('vlSpec'),
      labToggle=$('labToggle'), vlClose=$('vlClose'), vlName=$('vlName'),
      vlSave=$('vlSave'), vlList=$('vlList'), vlPresets=$('vlPresets'),
      vlPad=$('vlPad'), vlPadNote=$('vlPadNote'), vlRandom=$('vlRandom'), vlPadOct=$('vlPadOct'),
      tunExplorer=$('tunExplorer'), tunExplorerBtn=$('tunExplorerBtn'),
      txClose=$('txClose'), txRandom=$('txRandom'), txCount=$('txCount'),
      txHisto=$('txHisto'), txChips=$('txChips'), txSearch=$('txSearch'),
      txGrid=$('txGrid'), txPad=$('txPad'), txStatus=$('txStatus'), txDetail=$('txDetail'),
      txDetCanvas=$('txDetCanvas'), txDetRuler=$('txDetRuler'), txDetName=$('txDetName'), txDetMeta=$('txDetMeta'),
      txDetDesc=$('txDetDesc'), txDetCents=$('txDetCents'),
      txBack=$('txBack'), txHear=$('txHear'), txUse=$('txUse');

/* ==== GRID SIZE ==== */
const COLS=6, ROWS=3;

/* ---- build overlay lines ---- */
for(let i=1;i<COLS;i++){const l=document.createElement('div');l.className='drum-v';l.style.left=`${i*100/COLS}%`;grid.appendChild(l);}
for(let r=1;r<ROWS;r++){const l=document.createElement('div');l.className='drum-h';l.style.top=`${100-r*100/ROWS}%`;grid.appendChild(l);}

/* ==== AUDIO ==== */
let ctx;const audio=()=>{if(!ctx)ctx=new (window.AudioContext||webkitAudioContext)();if(ctx.state!=='running')ctx.resume();return ctx;};
/* master limiter bus — many overlapping voices (3-finger drags retrigger new
   oscillators while old release tails still sound) used to sum past 1.0 and
   hard-clip into crackles; the compressor squashes peaks smoothly instead */
let busNode=null;
const bus=()=>{const c=audio();
  if(!busNode){const comp=c.createDynamicsCompressor();
    comp.threshold.value=-10;comp.knee.value=6;comp.ratio.value=12;comp.attack.value=.003;comp.release.value=.25;
    const mg=c.createGain();mg.gain.value=.8;    // headroom so the off-bus met tick can't push the sum into clipping

  scaleGridEl.style.display=show?'block':'none';scaleLabels.style.display=show?'block':'none';
  if(!show)return;
  const X=spanX(),Y=spanY(),lines=[];let labels='';
  for(const k of allowedSemis){
    const pts=[];const add=(x,y)=>{if(x>=-1e-9&&x<=1+1e-9&&y>=-1e-9&&y<=1+1e-9)
      pts.push([Math.min(1,Math.max(0,x)),Math.min(1,Math.max(0,y))]);};
    add(0,k/Y);add(1,(k-X)/Y);add(k/X,0);add((k-Y)/X,1);   // clip X*x+Y*y=k to the unit square
    const uniq=pts.filter((p,j)=>pts.findIndex(q=>Math.abs(q[0]-p[0])<1e-6&&Math.abs(q[1]-p[1])<1e-6)===j);
    if(uniq.length<2)continue;
    const N=tunN(),[a,b]=uniq,isRoot=((k-rootSemi)%N+N)%N===0,hue=lineHue(k);
    lines.push('<line x1="'+(a[0]*100).toFixed(2)+'" y1="'+((1-a[1])*100).toFixed(2)+
      '" x2="'+(b[0]*100).toFixed(2)+'" y2="'+((1-b[1])*100).toFixed(2)+
      '" stroke="hsl('+hue.toFixed(0)+' 70% 70%/'+(isRoot?'.75':'.3')+')" stroke-width="'+(isRoot?2:1)+
      '" vector-effect="non-scaling-stroke"/>');
    if(isRoot){                                       // label only octave roots — the marker names notes live
      const top=a[1]>b[1]?a:b,bot=a[1]>b[1]?b:a;
      const lx=top[0]+(bot[0]-top[0])*.04,ly=top[1]+(bot[1]-top[1])*.04;
      labels+='<div class="scale-label" style="left:'+(lx*100).toFixed(2)+'%;top:'+((1-ly)*100).toFixed(2)+
        '%;color:hsl('+hue.toFixed(0)+' 80% 78%)">'+noteName(stepFreq(k))+'</div>';
    }
  }
  scaleGridEl.innerHTML=lines.join('');scaleLabels.innerHTML=labels;
}

/* ==== HEX KEYBOARD (Lumatone-style isomorphic keys, any EDO) ====
   Pointy-top hexes in axial coords: east neighbour = +A steps (whole tone,
   2*fifth − octave), northeast = +fifth — the Bosanquet/Wicki–Hayden layout
   generalized to the current EDO (12-EDO: east +2, NE +7). Step 0 (= BASE,
   the root C) sits at the bottom-left. */
let hexLayout=null;
/* layout basis: EDO steps per key going east (→) and northeast (↗).
   'auto' = generalized Wicki–Hayden (east = whole tone, NE = fifth);
   numeric prefs let the user build any isomorphic layout — translation
   invariance holds for every choice since pitch stays linear in (q,r). */
let hexEastPref='auto',hexNEPref='auto';
const hexEastStep=()=>hexEastPref==='auto'?Math.max(1,2*tunFifth()-tunN()):hexEastPref;
const hexNEStep=()=>hexNEPref==='auto'?tunFifth():hexNEPref;
function hexParams(){
  // size keys against the USABLE height (above the control stack), aiming for
  // ~7-8 rows — each row is a fifth up, so that spans a sane ~5 octaves.
  // hexScale is the user's key-size preference from the ⚙ panel.
  const bs=$('bottomStack'),bh=(bs&&bs.offsetHeight)||0;
  const w=pad.clientWidth||320,uh=Math.max(160,(pad.clientHeight||320)-bh-8);
  const ei=Math.min(edgeInset,w/6),ew=w-2*ei;        // playable span between the edge margins
  const s0=Math.max(22,Math.min(52,uh/11.4,ew/9.6));
  const s=Math.max(18,Math.min(96,s0*hexScale)),rx=Math.sqrt(3)/2*s;
  return {s,w,uh,rx,h:pad.clientHeight||320,x0:ei,x1:w-ei,ox:ei+rx+4,oy:uh-s-2};
}
const hexCenter=(q,r,L)=>({x:L.ox+Math.sqrt(3)*L.s*(q+r/2),y:L.oy-1.5*L.s*r});
function hexFromXY(x,y,L){
  const rf=(L.oy-y)/(1.5*L.s),qf=(x-L.ox)/(Math.sqrt(3)*L.s)-rf/2;
  let rq=Math.round(qf),rr=Math.round(rf);const rs=Math.round(-qf-rf);
  const dq=Math.abs(rq-qf),dr=Math.abs(rr-rf),ds=Math.abs(rs+qf+rf);
  if(dq>dr&&dq>ds)rq=-rr-rs;else if(dr>ds)rr=-rq-rs;
  return {q:rq,r:rr};
}
const hexStepOf=(q,r)=>q*hexEastStep()+r*hexNEStep();
function drawHexGrid(){
  hexCanvas.style.display=instrument==='hex'?'block':'none';
  if(instrument!=='hex')return;
  const L=hexParams();hexLayout=L;
  const dpr=Math.min(window.devicePixelRatio||1,3);
  hexCanvas.width=Math.round(L.w*dpr);hexCanvas.height=Math.round(L.h*dpr);
  const c=hexCanvas.getContext('2d');
  c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,L.w,L.h);
  c.textAlign='center';c.textBaseline='middle';
  // draw only keys that fit FULLY inside the pad — no sliced half-hexes at
  // the edges (edge taps snap inward to the nearest real key instead)
  const rMax=Math.ceil(L.oy/(1.5*L.s));
  for(let r=0;r<=rMax;r++){
    const y=L.oy-1.5*L.s*r;
    if(y<L.s-1)break;
    const qLo=Math.floor(-L.ox/(Math.sqrt(3)*L.s)-r/2),qHi=Math.ceil((L.w-L.ox)/(Math.sqrt(3)*L.s)-r/2);
    for(let q=qLo;q<=qHi;q++){
      const p=hexCenter(q,r,L);
      if(p.x<L.x0+L.rx-1||p.x>L.x1-L.rx+1)continue;
      const N=tunN(),st=hexStepOf(q,r),deg=((st-rootSemi)%N+N)%N;
      const inScale=!scalePCs||scalePCs.has(deg),isRoot=quantOn&&deg===0;
      const hue=lineHue(st);
      c.beginPath();
      for(let i=0;i<6;i++){const th=Math.PI/6+i*Math.PI/3;
        const vx=p.x+ (L.s-1)*Math.cos(th),vy=p.y+(L.s-1)*Math.sin(th);
        i?c.lineTo(vx,vy):c.moveTo(vx,vy);}
      c.closePath();
      c.fillStyle=inScale?('hsl('+hue.toFixed(0)+' '+(isRoot?60:42)+'% '+(isRoot?40:29)+'%/'+(isRoot?.85:.55)+')')
                         :'rgba(255,255,255,.045)';
      c.fill();
      c.strokeStyle=isRoot?'rgba(255,255,255,.5)':'rgba(255,255,255,.14)';
      c.lineWidth=isRoot?1.6:1;
      c.stroke();
      c.fillStyle='rgba(255,255,255,'+(inScale?.8:.25)+')';
      c.font=((edo===12&&!scl)?'600 10px':'600 9px')+' system-ui, sans-serif';
      c.fillText(noteName(stepFreq(st)),p.x,p.y);
    }
  }
}

          strikeT:vlSlider('vlStrikeT',.001,v=>Math.round(v*1000)+'ms')};
function syncLab(){

  vlSieve.value=labGen.sieve;

/* The genome, drawn: log-frequency axis, 5 octaves. Faint verticals = the
   CURRENT tuning's step grid (octaves brighter); white floor ticks = pure
   harmonics; colored bars = your partials (hue matches the note markers).
   Stretch shows as bars drifting off the harmonic ticks; match shows as bars
   snapping onto the grid; tilt is the height rolloff; width is the glow at
   the fundamental. Bottom strip: the attack/decay envelope over ~2s. */
function drawLabSpec(){
  if(voiceLabPanel.hidden)return;
  const c=vlSpec.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,3);
  const W=vlSpec.clientWidth||191,H=vlSpec.clientHeight||86;
  vlSpec.width=Math.round(W*dpr);vlSpec.height=Math.round(H*dpr);
  c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
  const OCT=5,X=r=>4+Math.log2(r)/OCT*(W-8),sH=H-18,N=tunN();
  for(let k=0;k<=2000;k++){                          // tuning grid (period boundaries brighter)
    const kc=stepCents(k);if(kc>1200*OCT)break;
    const oct=k%N===0;
    c.strokeStyle=oct?'rgba(255,255,255,.28)':'rgba(140,170,255,'+(N>24?.08:.15)+')';
    const x=X(Math.pow(2,kc/1200));
    c.beginPath();c.moveTo(x,2);c.lineTo(x,sH);c.stroke();
  }
  c.fillStyle='rgba(255,255,255,.4)';                // pure-harmonic floor ticks
  for(let k=1;k<=24;k++){const x=X(k);if(x<W-3)c.fillRect(x-.75,sH-5,1.5,5);}
  if(labGen.breath>0){                               // breath = a noise haze over the floor
    c.fillStyle='rgba(255,255,255,'+(labGen.breath*.3).toFixed(3)+')';
    c.fillRect(4,sH-labGen.breath*55,W-8,labGen.breath*55);
  }
  const parts=genomePartials(labGen),damp=labGen.damping||0;
  for(const [r,g] of parts){                         // partials: ghost = attack bloom, solid = sustain
    if(r>Math.pow(2,OCT))continue;
    const x=X(r),h=Math.pow(g,.7)*(sH-8),hue=(Math.log2(baseFreq()*r)*100)%360;
    const hs=Math.pow(g/(1+damp*2.5*Math.max(0,r-1)),.7)*(sH-8);
    if(labGen.width>0&&r<parts[0][0]*1.05&&r>parts[0][0]*.95){
      c.fillStyle='hsl('+hue.toFixed(0)+' 80% 65%/.2)';
      c.fillRect(x-1.5-labGen.width/6,sH-h,3+labGen.width/3,h);  // unison glow
    }
    c.fillStyle='hsl('+hue.toFixed(0)+' 80% 65%/.3)';
    c.fillRect(x-1.25,sH-h,2.5,h);
    c.fillStyle='hsl('+hue.toFixed(0)+' 80% 65%/.9)';
    c.fillRect(x-1.25,sH-hs,2.5,hs);
  }
  if(labGen.chiff>0&&labGen.strikeF){                // strike = diamond at its color ratio, size ∝ amount
    const sx=X(Math.min(31,labGen.strikeF)),sd=2+labGen.chiff*6;
    c.fillStyle='rgba(255,255,255,.8)';
    c.beginPath();c.moveTo(sx,6);c.lineTo(sx+sd,6+sd);c.lineTo(sx,6+2*sd);c.lineTo(sx-sd,6+sd);c.closePath();c.fill();
  }
  if(labGen.formantA>0){                             // formant = fixed-Hz resonance bump (vs the preview note)
    const rf=labGen.formantF/(baseFreq()*2);
    if(rf>1&&rf<Math.pow(2,OCT)){
      const fx=X(rf);c.strokeStyle='rgba(255,200,120,.6)';c.lineWidth=1.2;
      c.beginPath();
      for(let i=-20;i<=20;i++){const yy=sH-(labGen.formantA/18)*(sH*.55)*Math.exp(-i*i/70);
        i===-20?c.moveTo(fx+i*2,yy):c.lineTo(fx+i*2,yy);}
      c.stroke();c.lineWidth=1;
    }
  }
  const eY=H-2,eT=t=>4+Math.min(1,t/2)*(W-8);        // envelope strip (~2s window)
  c.strokeStyle='rgba(255,255,255,.5)';c.fillStyle='rgba(255,255,255,.14)';
  c.beginPath();c.moveTo(4,eY);
  const aX=eT(Math.max(.004,labGen.attack));c.lineTo(aX,sH+4);
  if(labGen.decay>0){for(let t=0;t<=1;t+=.05)
    c.lineTo(eT(labGen.attack+t*2),sH+4+(eY-sH-4)*(1-Math.exp(-t*2/labGen.decay)));}
  else c.lineTo(W-4,sH+4);
  c.stroke();c.lineTo(W-4,eY);c.closePath();c.fill();
}

let vlPadVoice=null,vlPadStep=null,padOct=2;

function vlPadStop(quick){
  if(!vlPadVoice)return;const v=vlPadVoice;vlPadVoice=null;vlPadStep=null;
  // gliss handoffs damp FAST — letting every step's long release ring out
  // stacks dozens of tails on a quick slide and crackles the limiter;

function vlPadPlay(y){

/* curated random — sample from musically-plausible distributions, not uniform
   noise: struck vs sustained decides coherent attack/decay/chiff; optional
   genes get a chance to be OFF so results have identity; match is preserved
   (that's the user's tuning philosophy, not a slider) */
function randomGen(){
  const R=Math.random,pick=a=>a[Math.floor(R()*a.length)];
  const struck=R()<.5;
  return sanitizeGen({
    count:2+Math.floor(R()*9),
    stretch:R()<.2?-(R()*R()*.3):R()*R()*.5,
    tilt:.5+R()*1.7,
    sieve:pick(['all','all','all','odd','oct','3rd']),
    width:R()<.4?0:2+Math.round(R()*14),
    attack:struck?.002+R()*.02:.03+R()*.22,
    decay:struck?.1+R()*1.1:0,
    damping:R()*.9,
    breath:R()<.5?0:R()*.35,
    formantF:250*Math.pow(14,R()),
    formantA:R()<.4?0:3+R()*11,
    motion:R()<.5?0:2+Math.round(R()*8),
    chiff:(struck?R()<.7:R()<.3)?R()*.6:0,
    strikeF:Math.pow(2,R()*4)*1.2,                   // log-uniform ×1.2..×19 — thump to click
    strikeT:struck?.004+R()*.03:.02+R()*.09,
    match:labGen.match,
  });
}

/* loop shape: measures per loop × beats per measure. Recorded events keep
   their absolute beatPos — shrinking the loop lets long phrases spill into
   later passes (they wrap), so switching back is non-destructive. */
const LOOP_BARS=[1,2,4,8,12,16];
function setLoopShape(ts,bars){
  timeSig=ts;barsPerLoop=bars;beatsPerLoop=ts*bars;
  timeSigSel.value=String(ts);barsSel.value=String(bars);
  scrubSlider.max=beatsPerLoop;
  if(+scrubSlider.value>=beatsPerLoop)scrubSlider.value=0;
  initDots();

  if(isPlay)reschedule();

/* ==== 🌐 TUNING EXPLORER — browse the whole Scala scale archive ====
   5,399 tunings bundled statically in scala-db.json (build-scala-db.py) and
   lazy-loaded on first open, so the synth itself boots without it and the
   app makes zero web requests. Navigation is visual: a note-count histogram
   picks a bin, facet dropdowns (family / period / intonation, each with live
   match counts) narrow it, and every scale renders as a "pitch ring" — its
   degrees placed around one period like a clock face, colored with the app's
   pitch-hue formula (non-octave periods get a dashed ring). Tap a ring for
   details — labeled ring, linear step ruler, an arpeggio preview with the
   CURRENT voice — then adopt it as the live tuning. */
const TX_BINS=(()=>{const b=[{label:'All',test:()=>true,n:12}];

function drawRing(cv,cents,px,detail){
  const dpr=Math.min(window.devicePixelRatio||1,3);

  c.beginPath();c.arc(cx,cy,R,0,2*Math.PI);c.stroke();
  c.setLineDash([]);
  const degs=[0].concat(cents.slice(0,N-1));         // period ≡ root — drawn once at the top

      c.textAlign='center';c.textBaseline='middle';

function txMatch(s,skip){
  if(skip!=='q'&&txSel.q&&
     s.name.toLowerCase().indexOf(txSel.q)<0&&s.desc.toLowerCase().indexOf(txSel.q)<0)return false;
  if(skip!=='fam'&&txSel.fam>=0&&s.fam!==txSel.fam)return false;
  if(skip!=='into'&&txSel.into>=0&&s.into!==txSel.into)return false;
  if(skip!=='per'&&txSel.per!=='all'&&s.pc!==txSel.per)return false;
  if(skip!=='count'&&txSel.count!=='All'){
    const b=TX_BINS.find(x=>x.label===txSel.count);

function txTally(skip,get){                          // per-option counts with `skip` facet ignored

  return m;

function txRebuild(){
  if(!txDB)return;

  const counts=new Array(TX_BINS.length).fill(0);
  txDB.forEach(s=>{if(!txMatch(s,'count'))return;
    counts[0]++;const n=s.cents.length;
    for(let i=1;i<TX_BINS.length;i++)if(TX_BINS[i].test(n)){counts[i]++;break;}});
  if(txSel.count!=='All'){const cur=TX_BINS.findIndex(b=>b.label===txSel.count);
    if(cur>0&&!counts[cur])txSel.count='All';}       // current bin filtered empty → fall back
  const mx=Math.max(1,...counts.slice(1));
  txHisto.innerHTML='';
  TX_BINS.forEach((b,i)=>{
    if(i>0&&!counts[i])return;
    const el=document.createElement('button');
    el.className='tx-bar'+(txSel.count===b.label?' on':'');
    const h=i===0?46:Math.max(3,Math.round(Math.sqrt(counts[i]/mx)*46));
    const hue=(Math.log2(b.n)*100)%360;
    el.innerHTML='<i style="height:'+h+'px;background:hsl('+hue.toFixed(0)+' 70% '+(i===0?'40%':'55%')+
      '/.85)"></i><b>'+b.label+'</b><u>'+(i===0?counts[0]:counts[i])+'</u>';
    el.onclick=()=>{txSel.count=b.label;txRebuild();};

  const famT=txTally('fam',s=>s.fam),perT=txTally('per',s=>s.pc),intoT=txTally('into',s=>s.into);
  txBuildSel(txFamSel,TX_FAMS,txSel.fam,k=>k<0?famT._tot:(famT[k]||0));
  txBuildSel(txPerSel,TX_PERS,txSel.per,k=>k==='all'?perT._tot:(perT[k]||0));
  txBuildSel(txIntoSel,TX_INTOS,txSel.into,k=>k<0?intoT._tot:(intoT[k]||0));
  txBuildSel(txSortSel,TX_SORTS,txSel.sort,null);

  txItems=txDB.filter(s=>txMatch(s));
  if(txSel.sort==='notes')txItems.sort((a,b)=>a.cents.length-b.cents.length||(a.name<b.name?-1:1));

/* Releasing a voice mid-envelope (attack ramp still pending, or a struck
   voice's long decay curve still in flight — e.g. Singing Bowl held-decay)
   must pin the envelope at its EXACT current value before fading, or the
   value jumps discontinuously = pop. Browsers' cancelAndHoldAtTime computes
   that pin unreliably inside an active setTargetAtTime (Chrome/Android), so
   we never ask it to: each voice carries its own analytic envelope (envAt)
   and we pin the mathematically-known value ourselves. */

  if(v.released)return;v.released=true;

  try{gp.cancelScheduledValues(at);gp.setValueAtTime(Math.max(.0001,v.envAt(at)),at);}catch(_){}
  gp.setTargetAtTime(0,at,tau||v.rel||RELEASE);

  return null;

function genomePartials(gen){

    if(gen.sieve==='oct'&&(k&(k-1))!==0)continue;      // powers of two

function makeVoice(f,inst,at,gen){

function startVoice(pid,f,name,mx,my,nx,ny){

function synthStart(pid,x,y){
  if(touches.has(pid))synthEnd(pid);

  startVoice(pid,q.f,noteName(q.f),q.nx*w,(1-q.ny)*h,q.nx,q.ny);

/* hex keys: discrete pitches; dragging onto a new key retriggers (gliss) */

// phantom hits would shift row by row. Snap into the drawn range instead,
// mirroring drawHexGrid's bounds exactly.

  const rTop=Math.floor((L.oy-(L.s-1))/(1.5*L.s));

/* ==== DRUM HIT ==== */
function hitDrum(x,y,playback=false){
  const w=pad.clientWidth,h=pad.clientHeight;
  const nx=x/w, gy=1-y/h;                                 // gy 0(bottom)->1(top)
  const col=Math.min(COLS-1,Math.max(0,Math.floor(nx*COLS)));
  const row=Math.min(ROWS-1,Math.max(0,Math.floor(gy*ROWS)));
  const kind=rowInstruments[row][col];
  const localP=Math.min(1,Math.max(0,(gy*ROWS)-row));      // 0..1 inside row
  voiceDest=(!playback&&isRec&&curRec)?trackOut(curRec.id):voiceDest;
  try{drumMap[kind](localP);}finally{voiceDest=null;}
  showHit(kind,x,y,playback);
  return {kind,row,col,x:nx,gy,localP};
}

/* ==== POINTER DISPATCH ==== */
function startNote(pid,x,y){
  if(instrument==='drums'){record({type:'drum',...hitDrum(x,y,false)});return;}
  instrument==='hex'?hexStart(pid,x,y):synthStart(pid,x,y);
}
function moveNote(pid,x,y){
  if(instrument==='hex')hexMove(pid,x,y);else if(instrument==='synth')synthMove(pid,x,y);
}
function endNote(pid){if(instrument!=='drums')synthEnd(pid);}

/* ==== RECORDINGS UI ==== */
function addRow(r){
  const row=document.createElement('div');row.className='recording-item';row.id='rec-'+r.id;
  row.innerHTML=`<div class="recording-name"></div>
  <div class="recording-controls"><button title="mute / unmute"></button><button title="delete">×</button></div>`;
  row.querySelector('.recording-name').textContent=r.name;
  const [tog,del]=row.querySelectorAll('button');
  row.classList.toggle('active',r.active);
  tog.textContent=r.active?'🔊':'🔇';
  recordingsList.appendChild(row);
  // the toggle is a MUTE button: it never starts or stops the transport, and
  // it applies immediately mid-cycle (unmute joins the current pass, mute
  // cancels this pass's pending notes and fades anything sounding)
  tog.onclick=()=>{r.active=!r.active;row.classList.toggle('active',r.active);
    tog.textContent=r.active?'🔊':'🔇';updateBadge();
    if(isPlay){reschedule();if(!r.active)killTrackNotes(r.id);}};
  del.onclick=()=>{
    if(!confirm('Delete '+r.name+'?'))return;
    if(r===curRec){isRec=false;curRec=null;recordBtn.classList.remove('active');
      recordBtn.textContent='Rec';scrubSlider.disabled=false;}
    recordings=recordings.filter(a=>a!==r);row.remove();updateBadge();
    killTrackNotes(r.id);dropTrackGain(r.id);
    if(!recordings.some(a=>a.active))stopPlayback();else if(isPlay)reschedule();};
  // per-track volume — drives the track's GainNode live (playback AND the
  // overdub monitor), persisted in the song file. createElement, not
  // innerHTML: the node test harness only parses div/button from markup.
  const vol=document.createElement('input');
  vol.type='range';vol.min='0';vol.max='100';vol.className='rec-vol';vol.title='track volume';
  vol.value=String(Math.round((typeof r.gain==='number'?r.gain:1)*100));
  vol.oninput=()=>setTrackGain(r,(+vol.value||0)/100);
  row.appendChild(vol);
}

/* ==== RECORD CONTROL ==== */
function startRecording(){
  const c=audio();
  // Rec implies Play: with existing active tracks, start the loop so the
  // overdub is heard in context (playback engages FIRST so the recorder
  // joins its grid instead of re-anchoring).
  if(!isPlay&&recordings.some(r=>r.active))startPlayback();
  // Anchor the loop at the Rec press (metronome NOT required) — beat 0 is the
  // press itself, so off-beat/pickup starts land where they were played. A
  // grid already running (met ticking or tracks playing) keeps its anchor.
  if(loopAnchor===null||(!tickTimer&&!isPlay))loopAnchor=c.currentTime;
  const r={id:recSeq++,name:'Track '+(recSeq-1),events:[],active:false,gain:1};
  recordings.push(r);curRec=r;isRec=true;addRow(r);
  recordBtn.classList.add('active');recordBtn.textContent='Rec*';scrubSlider.disabled=true;
  if(metOn&&!tickTimer)startMet();
  startTicker();
}
function stopRecording(autoPlay){
  if(!isRec)return;
  // close out any notes still held so playback never loops an endless oscillator
  touches.forEach(t=>{if(curRec.events.some(e=>e.type==='start'&&e.id===t.id))record({type:'end',id:t.id});});
  isRec=false;recordBtn.classList.remove('active');recordBtn.textContent='Rec';scrubSlider.disabled=false;
  if(!curRec.events.length){recordings=recordings.filter(a=>a!==curRec);$('rec-'+curRec.id)?.remove();}
  else{curRec.active=true;const row=$('rec-'+curRec.id);
    if(row){row.classList.add('active');row.querySelector('button').textContent='🔊';}}
  updateBadge();if(autoPlay!==false&&curRec.active&&!isPlay)startPlayback(true);curRec=null;
  if(tickTimer&&!isPlay)stopMet();                 // no session left → pause the ticking
}

/* ==== PLAYBACK ==== */
function fadeNote(n,at){
  releaseVoice(n.v,at);n.m.style.opacity='0';n.m.style.transition=`opacity ${RELEASE}s`;
  const c=audio();
  setTimeout(()=>n.m.remove(),Math.max(0,(at-c.currentTime)*1000)+MARKER_FADE);
  setTimeout(()=>n.v.stop(),Math.max(0,(at-c.currentTime)*1000)+n.v.tail);
}
function killTrackNotes(rid){
  playNotes.forEach((n,key)=>{if(key.indexOf(rid+'_')===0){fadeNote(n,audio().currentTime);playNotes.delete(key);}});
}
function dispatch(rid,ev,when){
  const c=audio(),at=Math.max(when||c.currentTime,c.currentTime+.005);   // schedule on the audio clock, not timer-fire time
  if(ev.type==='drum'){
    const x=ev.x*pad.clientWidth,y=(1-ev.gy)*pad.clientHeight,fn=drumMap[ev.kind];
    voiceDest=trackOut(rid);
    try{if(fn)fn(ev.localP,at);}finally{voiceDest=null;}
    showHit(ev.kind,x,y,true);return;
  }
  const key=rid+'_'+ev.id;
  if(ev.type==='start'){
    const old=playNotes.get(key);if(old){fadeNote(old,c.currentTime);playNotes.delete(key);}
    const x=ev.nx*pad.clientWidth,y=(1-ev.ny)*pad.clientHeight;
    voiceDest=trackOut(rid);
    let v;try{v=makeVoice(ev.f,ev.inst||'sine',at,ev.gen);}finally{voiceDest=null;}  // replay with the recorded voice, at the track's volume
    const m=marker('playback-marker',x,y,'rgba(255,255,0,.25)',ev.name);
    playNotes.set(key,{v,m});
  }else if(ev.type==='update'){
    const n=playNotes.get(key);if(!n)return;
    const x=ev.nx*pad.clientWidth,y=(1-ev.ny)*pad.clientHeight;
    n.v.setFreq(ev.f,at);Object.assign(n.m.style,{left:x+'px',top:y+'px'});n.m.textContent=ev.name;
  }else{
    const n=playNotes.get(key);if(!n)return;
    fadeNote(n,at);playNotes.delete(key);
  }

function scheduleCycle(gen,n){
  if(gen!==playGen)return;
  const c=audio(),loop=60/tempo*beatsPerLoop,cycleStart=playOrigin+n*loop,now=c.currentTime;
  recordings.filter(r=>r.active).forEach(r=>r.events.forEach(ev=>{
    const when=cycleStart+ev.beatPos*60/tempo;
    if(when<now-.03)return;                                  // already in the past (mid-cycle start / throttled tab)
    playTimers.push(setTimeout(()=>{if(gen===playGen)dispatch(r.id,ev,when);},Math.max(0,(when-now)*1000-40)));

function reschedule(){                                       // (re)build the timer chain from the current loop position

function startPlayback(fromTop){
  if(isRec){stopRecording(false);fromTop=true;}    // finishing a take always replays from the top
  if(isPlay)return;
  // no active tracks is fine — the transport still rolls (ticker, scrubber,
  // and the metronome if armed) so you can jam to a click before recording
  const c=audio();
  if(loopAnchor===null||!tickTimer){               // no metronome running → start from the scrubber playhead
    const b=fromTop?0:Math.min(beatsPerLoop-.001,Math.max(0,+scrubSlider.value||0));
    loopAnchor=c.currentTime+.02-b*60/tempo;

function stopPlayback(){
  if(!isPlay)return;isPlay=false;playGen++;playBtn.classList.remove('active');playBtn.textContent='Play';
  playTimers.forEach(clearTimeout);playTimers=[];clearTimeout(cycleTimer);cycleTimer=null;
  playNotes.forEach(n=>fadeNote(n,ctx.currentTime));playNotes.clear();
  if(tickTimer&&!isRec)stopMet();                  // session over — met mode stays armed, ticking pauses

/* ==== METRONOME ==== */
let dotStride=1;                     // long loops show one dot per MEASURE so the strip fits a phone
function initDots(){
  dotStride=beatsPerLoop>48?timeSig:1;
  const n=Math.ceil(beatsPerLoop/dotStride);
  beatIndicator.style.gap=n>32?'2px':'4px';
  beatIndicator.innerHTML='';
  for(let i=0;i<n;i++){const d=document.createElement('div');
    d.className='beat-marker'+((dotStride>1||i%timeSig===0)?' accent':'');beatIndicator.appendChild(d);}
}
function flash(i){const idx=i<0?-1:Math.floor(i/dotStride);
  [...beatIndicator.children].forEach((d,k)=>d.classList.toggle('active',k===idx));}
function calcGrid(){return 60/tempo;}
function updateCounter(){barCounter.textContent=`${bar+1}.${beat+1}`;}
function scheduleBeat(gen){
  if(gen!==metGen)return;const c=audio();
  if(nextBeat<c.currentTime-.05){                    // tab was throttled: skip the missed beats instead of burst-firing them
    const grid=calcGrid(),ahead=Math.ceil((c.currentTime+.02-loopAnchor)/grid);
    nextBeat=loopAnchor+ahead*grid;
    const q=((ahead%beatsPerLoop)+beatsPerLoop)%beatsPerLoop;beat=q%timeSig;bar=Math.floor(q/timeSig);
  }
  const accent=!beat;
  // enveloped tick — a raw sine hard-stopped mid-waveform pops; decay to
  // silence before the stop so there is no discontinuity. metVol scales the
  // levels (its own "track" volume); at zero skip the osc entirely — an
  // exponential ramp can't start from 0 and the visuals should still run.
  if(metVol>.001){
    const o=c.createOscillator(),g=c.createGain();o.frequency.value=accent?1000:800;
    g.gain.setValueAtTime((accent?.15:.09)*metVol,nextBeat);g.gain.exponentialRampToValueAtTime(.0005,nextBeat+.045);
    o.connect(g);g.connect(c.destination);o.start(nextBeat);o.stop(nextBeat+.055);  // met stays off the limiter bus
  }
  // capture THIS beat's position — the globals advance to the next beat below,
  // and reading them in the timer callback made the display lead by one.
  // gen-guarded: a queued flash from a chain that was stopped mid-flight
  // (scrub, tempo change) must not paint a stale beat.
  const vb=bar*timeSig+beat,vt=(bar+1)+'.'+(beat+1);
  setTimeout(()=>{if(gen!==metGen)return;
    metLight.classList.add('active');setTimeout(()=>metLight.classList.remove('active'),80);
    flash(vb);barCounter.textContent=vt;},Math.max(0,(nextBeat-c.currentTime)*1000-5));
  beat=(beat+1)%timeSig;if(!beat){bar=(bar+1)%barsPerLoop;}
  nextBeat+=calcGrid();tickTimer=setTimeout(()=>scheduleBeat(gen),(nextBeat-c.currentTime-.005)*1000);}
function startMet(){
  // the met is a MODE: it only ticks during a play/record session, deriving
  // its grid from the same loopAnchor so it's always locked to the loop
  if(!metOn||(!isPlay&&!isRec))return;
  const c=audio();if(loopAnchor===null)loopAnchor=c.currentTime+.02;
  metGen++;const grid=calcGrid(),req=c.currentTime+.02;
  const ahead=Math.ceil((req-loopAnchor)/grid);nextBeat=loopAnchor+ahead*grid;
  const q=((ahead%beatsPerLoop)+beatsPerLoop)%beatsPerLoop;beat=q%timeSig;bar=Math.floor(q/timeSig);
  flash(bar*timeSig+beat);updateCounter();scheduleBeat(metGen);}
function stopMet(){metGen++;clearTimeout(tickTimer);tickTimer=null;
  [...beatIndicator.children].forEach(d=>d.classList.remove('active'));}

/* ==== LOOP POSITION TICKER (drives the scrubber + the dots when the met isn't) ==== */
let posTimer=null;
function loopPos(){return ((((audio().currentTime-loopAnchor)*tempo/60)%beatsPerLoop)+beatsPerLoop)%beatsPerLoop;}
function tickPos(){
  if(!isRec&&!isPlay){flash(-1);posTimer=null;return;}
  if(loopAnchor!==null){
    const pos=loopPos();
    if(!scrubHeld)scrubSlider.value=pos;   // don't fight the user's thumb mid-drag
    if(!tickTimer){const b=Math.floor(pos);beat=b%timeSig;bar=Math.floor(b/timeSig);flash(b);updateCounter();}
  }
  posTimer=setTimeout(tickPos,80);
}
function startTicker(){if(posTimer===null)tickPos();}

/* ==== TIME SCRUBBER ====
   The slider IS the playhead: dragging shifts loopAnchor so "now" sits at the
   chosen beat — playback, metronome and dots all move coherently with it. */
function scrubTo(b){
  if(isRec)return;                          // scrubbing mid-take would rewrite recorded positions
  const c=audio();
  loopAnchor=c.currentTime-b*60/tempo;
  playNotes.forEach(n=>fadeNote(n,c.currentTime));playNotes.clear();
  if(isPlay)reschedule();
  if(tickTimer){stopMet();startMet();}      // startMet re-derives beat/bar and owns them from here —
  else{                                     // clobbering them after it desynced the accents/counter
    const bi=Math.floor(b);beat=bi%timeSig;bar=Math.floor(bi/timeSig);flash(bi);updateCounter();
  }
}
scrubSlider.oninput=e=>scrubTo(Math.min(beatsPerLoop-.001,Math.max(0,+e.target.value||0)));
/* while the finger is on the scrubber, the 80ms position ticker must not
   overwrite the slider value — it made the thumb snap away mid-drag */
let scrubHeld=false;
['pointerdown','touchstart'].forEach(ev=>scrubSlider.addEventListener(ev,()=>{scrubHeld=true;}));
['pointerup','pointercancel','touchend','touchcancel'].forEach(ev=>scrubSlider.addEventListener(ev,()=>{scrubHeld=false;}));
scrubSlider.onchange=()=>{scrubHeld=false;};

/* ==== UI LISTENERS ==== */
tempoSlider.oninput=e=>{
  // hold the playhead still through the change: loopPos is (now-anchor)·tempo,
  // so a fixed anchor would teleport the position by the tempo ratio mid-play
  const pos=((isPlay||isRec)&&loopAnchor!==null)?loopPos():null;
  tempo=+e.target.value;tempoValue.textContent=tempo+' BPM';
  if(pos!==null)loopAnchor=audio().currentTime-pos*60/tempo;
  if(metOn){stopMet();startMet();}if(isPlay)reschedule();};
/* the metronome is presented as a pinned pseudo-track: a row in the
   Recordings panel with the same mute toggle + volume slider as real tracks.
   It follows the transport exactly like a track (only ticks while playing or
   recording); metOn is its mute state, metVol its volume (a pref, not song
   data). The Met button in the control strip is a shortcut to the same
   toggle — both stay in sync through syncMetUI(). */
const metRowEl=$('metRow');
metRowEl.className='recording-item';
const metRowName=document.createElement('div');
metRowName.className='recording-name';metRowName.textContent='Metronome';
const metRowCtl=document.createElement('div');metRowCtl.className='recording-controls';
const metRowTog=document.createElement('button');metRowTog.title='metronome on / off';
metRowCtl.appendChild(metRowTog);
const metRowVol=document.createElement('input');
metRowVol.type='range';metRowVol.min='0';metRowVol.max='100';metRowVol.className='rec-vol';metRowVol.title='metronome volume';
metRowEl.appendChild(metRowName);metRowEl.appendChild(metRowCtl);metRowEl.appendChild(metRowVol);
function syncMetUI(){
  metBtn.textContent=metOn?'Met:On':'Met:Off';
  metRowTog.textContent=metOn?'🔊':'🔇';
  metRowEl.classList.toggle('active',metOn);
  metRowVol.value=String(Math.round(metVol*100));
}
function toggleMet(){
  metOn=!metOn;syncMetUI();
  if(!metOn){stopMet();return;}
  if(!isPlay&&recordings.some(r=>r.active))startPlayback();   // met implies play (startPlayback starts the ticking)
  else if(isPlay||isRec)startMet();                           // joining a running session: tick in sync
}
metBtn.onclick=toggleMet;
metRowTog.onclick=toggleMet;
metRowVol.oninput=()=>{metVol=Math.min(1,Math.max(0,(+metRowVol.value||0)/100));saveQuantPrefs();};
recordBtn.onclick=()=>isRec?stopRecording():startRecording();
playBtn.onclick=()=>isPlay?stopPlayback():startPlayback();
stopBtn.onclick=()=>{isRec&&stopRecording(false);isPlay&&stopPlayback();};
recToggle.onclick=()=>{recordingsPanel.classList.toggle('visible');arrow.textContent=recordingsPanel.classList.contains('visible')?'▲':'▼';};

/* ==== POINTER EVENTS ==== */
function down(e){e.preventDefault();
  if(e.type==='mousedown'){startNote('mouse',e.clientX,e.clientY);
    if(instrument!=='drums'){document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);}}
  else[...e.changedTouches].forEach(t=>startNote(t.identifier,t.clientX,t.clientY));}
function move(e){e.preventDefault();
  if(e.type==='mousemove')moveNote('mouse',e.clientX,e.clientY);
  else[...e.changedTouches].forEach(t=>moveNote(t.identifier,t.clientX,t.clientY));}
function up(e){
  if(e.type==='mouseup'){endNote('mouse');document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);}
  else[...e.changedTouches].forEach(t=>endNote(t.identifier));}
pad.addEventListener('mousedown',down);
pad.addEventListener('touchstart',down,{passive:false});
pad.addEventListener('touchmove',move,{passive:false});
pad.addEventListener('touchend',up);pad.addEventListener('touchcancel',up);
pad.addEventListener('contextmenu',e=>e.preventDefault());
/* release notes if the pointer leaves the page or the window loses focus — otherwise they drone forever */
document.addEventListener('mouseleave',()=>{if(touches.has('mouse')){synthEnd('mouse');
  document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);}});
window.addEventListener('blur',()=>[...touches.keys()].forEach(pid=>synthEnd(pid)));

/* ==== INIT ==== */
loadQuantPrefs();applyQuant();
setLoopShape(timeSig,barsPerLoop);
scrubSlider.value=0;syncLab();renderVoiceLib();renderPresets();syncMetUI();

/* ==== EXTERNAL SAVE / LOAD API ====
   Used by the Extras "Synth" window to save the current song (all
   recordings + tempo) into the creature-collect save file and load it
   back. The "song" is just the recordings array + tempo; runtime-only
   fields (active flag, ids) are dropped on save and rebuilt on load. */
window.SynthApp = {
  getSong: function () {
    return {
      v: 1,
      tempo: tempo,
      scale: scaleKey,
      root: rootSemi,
      edo: edo,
      scl: scl ? { name: scl.name, cents: scl.cents.slice() } : null,
      timeSig: timeSig,
      bars: barsPerLoop,
      voices: voiceLib.map(function (v) { return { name: v.name, gen: Object.assign({}, v.gen) }; }),
      recordings: recordings.map(function (r) {
        return { name: r.name, events: r.events,
                 gain: (typeof r.gain === 'number') ? r.gain : 1 };
      })
    };
  },
  clearAll: function () {
    // wipes every track — the confirm lives in the extras window's top bar
    stopPlayback();
    if (isRec) stopRecording(false);
    recordings = [];
    recordingsList.innerHTML = '';
    dropAllTrackGains();
    updateBadge();
    scrubSlider.value = 0;
  },
  loadSong: function (song) {
    if (!song) return;
    if (isRec) stopRecording(false);
    if (isPlay) stopPlayback();
    recordings = [];
    recordingsList.innerHTML = '';
    dropAllTrackGains();
    if (typeof song.tempo === 'number' && song.tempo > 0) {
      tempo = song.tempo;
      tempoSlider.value = tempo;
      tempoValue.textContent = tempo + ' BPM';
    }
    var sc = sanitizeScl(song.scl);
    if (EDOS.includes(song.edo)) edo = song.edo; else if (song.scale && !sc) edo = 12;
    scl = sc || null;   // legacy songs (no scl field) land back in EDO mode
    if (typeof song.scale === 'string' && SCALES.hasOwnProperty(song.scale)) scaleKey = song.scale;
    if (typeof song.root === 'number' && song.root >= 0 && song.root < tunN()) rootSemi = Math.floor(song.root);
    applyQuant();
    // loop shape the song was recorded against (legacy songs: the old 4×8)
    var ts = (typeof song.timeSig === 'number' && song.timeSig >= 2 && song.timeSig <= 9) ? Math.round(song.timeSig) : 4;
    var bl = LOOP_BARS.includes(song.bars) ? song.bars : 8;
    setLoopShape(ts, bl);
    // merge the song's saved voices into the library (existing names win)
    if (Array.isArray(song.voices)) {
      song.voices.forEach(function (v) {
        if (!v || typeof v.name !== 'string') return;
        var nm = v.name.trim().slice(0, 24);
        if (!nm || voiceLib.length >= 64) return;
        if (voiceLib.some(function (x) { return x.name === nm; })) return;
        voiceLib.push({ name: nm, gen: sanitizeGen(v.gen) });
      });
      saveQuantPrefs(); buildVoiceOptions(); renderVoiceLib();
    }
    (Array.isArray(song.recordings) ? song.recordings : []).forEach(function (s) {
      var r = {
        id: recSeq++,
        name: (s && s.name) ? s.name : ('Track ' + (recSeq - 1)),
        events: (s && Array.isArray(s.events)) ? s.events : [],
        active: true,  // loaded tracks arrive unmuted — the toggle no longer auto-plays
        gain: (s && typeof s.gain === 'number' && s.gain >= 0 && s.gain <= 1) ? s.gain : 1
      };
      recordings.push(r);
      addRow(r);
    });
    updateBadge();
  }
};
});
</script>
</body>
