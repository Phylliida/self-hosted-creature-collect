    // Use DataTransferItemList interface to access the file(s)

      // If dropped items aren't files, reject them

        var file = ev.dataTransfer.items[i].getAsFile();
        
          parseDotFile(file, function(graph) {
          
            ForceGraph(graph);
          });
        console.log('... file[' + i + '].name = ' + file.name);

    for (var i = 0; i < ev.dataTransfer.files.length; i++) {
      console.log('... file[' + i + '].name = ' + ev.dataTransfer.files[i].name);
    }
  }
}

function confirmResetQuiver() {

}
function cancelResetQuiver() {
    var p = document.getElementById("resetConfirmPanel");
    if (p) p.style.display = "none";
}
function performResetQuiver() {
    cancelResetQuiver();
    // Back to the bundled default quiver: clear the hash + reload.
    suppressUndoRecord = false;
    window.location.hash = "";
    window.location.reload();
}

var undoRedoEnabled = true; // always on — undo/redo buttons are permanent
var undoStack = [];
var undoIndex = -1;
var undoMaxSize = 8000;
var suppressUndoRecord = false;

function loadUndoStack() {
    try {
        var s = localStorage.getItem("quiverUndoStack");
        undoStack = s ? JSON.parse(s) : [];
        var i = localStorage.getItem("quiverUndoIndex");
        undoIndex = i != null ? parseInt(i) : (undoStack.length - 1);
    } catch (e) {
        undoStack = []; undoIndex = -1;
    }
}

function saveUndoStack() {
    try {
        localStorage.setItem("quiverUndoStack", JSON.stringify(undoStack));
        localStorage.setItem("quiverUndoIndex", String(undoIndex));
    } catch (e) {
        // quota exceeded — drop oldest half and retry once
        undoStack = undoStack.slice(undoStack.length >> 1);
        undoIndex = undoStack.length - 1;
        try {
            localStorage.setItem("quiverUndoStack", JSON.stringify(undoStack));
            localStorage.setItem("quiverUndoIndex", String(undoIndex));
        } catch (e2) {}
    }
}

function recordUndo(hash) {
    if (!undoRedoEnabled || suppressUndoRecord) return;
    if (undoStack[undoIndex] === hash) return;
    if (undoIndex < undoStack.length - 1) undoStack = undoStack.slice(0, undoIndex + 1);
    undoStack.push(hash);
    if (undoStack.length > undoMaxSize) undoStack.shift();
    undoIndex = undoStack.length - 1;
    saveUndoStack();
    updateUndoRedoButtons();
}

function undoAction() {
    if (undoIndex <= 0) return;
    undoIndex--;
    suppressUndoRecord = true;
    window.location.hash = undoStack[undoIndex];
    saveUndoStack();
    updateUndoRedoButtons();
    setTimeout(function() { suppressUndoRecord = false; }, 300);
}

function redoAction() {
    if (undoIndex >= undoStack.length - 1) return;
    undoIndex++;
    suppressUndoRecord = true;
    window.location.hash = undoStack[undoIndex];
    saveUndoStack();
    updateUndoRedoButtons();
    setTimeout(function() { suppressUndoRecord = false; }, 300);
}

function updateUndoRedoButtons() {
    var undoBtn = document.getElementById("undoButton");
    var redoBtn = document.getElementById("redoButton");
    if (undoBtn) undoBtn.style.opacity = undoIndex > 0 ? "1" : "0.3";
    if (redoBtn) redoBtn.style.opacity = undoIndex < undoStack.length - 1 ? "1" : "0.3";
}

function refreshUndoRedoVisibility() {
    var panel = document.getElementById("undoRedoPanel");
    if (panel) panel.style.display = undoRedoEnabled ? "flex" : "none";
    var toggleBtn = document.getElementById("undoRedoToggleButton");
    if (toggleBtn) toggleBtn.className = undoRedoEnabled ? "selectedButton" : "defaultButton";
}

function toggleUndoRedo() {
    undoRedoEnabled = !undoRedoEnabled;
    if (typeof localStorage !== 'undefined') {
        localStorage.setItem("quiverUndoEnabled", undoRedoEnabled ? "1" : "0");
    }
    if (undoRedoEnabled) {
        loadUndoStack();
        if (window.location.hash && undoStack[undoIndex] !== window.location.hash) {
            recordUndo(window.location.hash);
        }
    }
    refreshUndoRedoVisibility();
    updateUndoRedoButtons();
}

var mutationGraph = {
    enabled: false,
    baseSnap: null,
    ops: [],
    nodesBySig: {},
    nodesList: [],
    edges: [],
    edgesKey: {},
    currentSig: null,
    nextLabel: 0
};

function quiverSig(nodes, links) {
    var ids = nodes.map(n => n.id + "").sort();
    var idToI = {};
    for (var i = 0; i < ids.length; i++) idToI[ids[i]] = i;
    var n = ids.length;
    var b = [];
    for (var i = 0; i < n; i++) {
        var row = [];
        for (var j = 0; j < n; j++) row.push("0");
        b.push(row);
    }
    for (var k = 0; k < links.length; k++) {
        var l = links[k];
        var src = (l.source && l.source.id !== undefined) ? l.source.id : l.source;
        var tgt = (l.target && l.target.id !== undefined) ? l.target.id : l.target;
        var s = idToI[src + ""];
        var t = idToI[tgt + ""];
        b[s][t] = "" + l.label;
        b[t][s] = "-" + l.label;
    }
    var frozenStr = ids.map(id => {
        var node = nodes.find(nn => (nn.id + "") === id);
        return node && node.frozen ? "1" : "0";
    }).join("");
    return frozenStr + "|" + b.map(r => r.join(",")).join(";");
}

function snapshotQuiver(nodes, links) {
    return {
        nodes: nodes.map(n => ({
            id: n.id, color: n.color, x: n.x, y: n.y, label: n.label, frozen: n.frozen
        })),
        links: links.map(l => ({
            source: (l.source && l.source.id !== undefined) ? l.source.id : l.source,
            target: (l.target && l.target.id !== undefined) ? l.target.id : l.target,
            color: l.color, label: l.label
        }))
    };
}

function addQuiverNode(sig, snap, initialPos) {
    if (mutationGraph.nodesBySig[sig]) return mutationGraph.nodesBySig[sig];
    var node = { id: sig, label: "" + mutationGraph.nextLabel++, snap: snap };
    if (initialPos) {
        node.x = initialPos.x;
        node.y = initialPos.y;
        if (mutationGraphFrozen) {
            node.fx = initialPos.x;
            node.fy = initialPos.y;
        }
    }
    mutationGraph.nodesBySig[sig] = node;
    mutationGraph.nodesList.push(node);
    return node;
}

function addMutationEdge(a, b, label, vid) {
    var key = a < b ? a + "##" + b : b + "##" + a;
    if (mutationGraph.edgesKey[key]) return false;
    mutationGraph.edgesKey[key] = true;
    mutationGraph.edges.push({ source: a, target: b, label: label, vid: vid });
    return true;
}

function recordMutationInGraph(beforeSnap, afterSnap, mutatedVertexId, mutatedLabel) {
    if (!mutationGraph.enabled) return;
    var beforeSig = quiverSig(beforeSnap.nodes, beforeSnap.links);
    var afterSig = quiverSig(afterSnap.nodes, afterSnap.links);
    var beforeNew = !mutationGraph.nodesBySig[beforeSig];
    var afterNew = !mutationGraph.nodesBySig[afterSig];
    addQuiverNode(beforeSig, beforeSnap);
    var beforeNode = mutationGraph.nodesBySig[beforeSig];
    var afterInitPos = null;
    if (afterNew && beforeNode && beforeNode.x != null) {
        afterInitPos = {
            x: beforeNode.x + (Math.random() - 0.5) * 30,
            y: beforeNode.y + (Math.random() - 0.5) * 30
        };
    }
    addQuiverNode(afterSig, afterSnap, afterInitPos);
    var fromIdx = -1;
    for (var i = 0; i < mutationGraph.nodesList.length; i++) {
        if (mutationGraph.nodesList[i].id === beforeSig) { fromIdx = i; break; }
    }
    mutationGraph.ops.push({ f: fromIdx, v: mutatedVertexId });
    var edgeNew = false;
    if (beforeSig !== afterSig) edgeNew = addMutationEdge(beforeSig, afterSig, mutatedLabel, mutatedVertexId);
    mutationGraph.currentSig = afterSig;
    if (beforeNew || afterNew || edgeNew) {
        renderMutationGraph();
    } else {
        updateMutationGraphHighlight();
    }
}

function mutateSnap(snap, vertexId) {
    var nodes = snap.nodes;
    var idToI = {};
    var iToId = {};
    for (var i = 0; i < nodes.length; i++) {
        idToI[nodes[i].id] = i;
        iToId[i] = nodes[i].id;
    }
    if (idToI[vertexId] === undefined) return snap;
    var ncols = nodes.length;
    var bMat = makeArr(ncols, i => makeArr(ncols, j => BigInt(0)));
    for (var k = 0; k < snap.links.length; k++) {
        var link = snap.links[k];
        bMat[idToI[link.source]][idToI[link.target]] = BigInt(link.label);
        bMat[idToI[link.target]][idToI[link.source]] = -BigInt(link.label);
    }
    var q = new Quiver(bMatrixToWeights(bMat));
    q.mutate(idToI[vertexId], true);
    var newLinks = [];
    for (var i = 0; i < q.b_matrix.length; i++) {
        for (var j = 0; j < q.b_matrix[i].length; j++) {
            var value = q.b_matrix[i][j];
            if (value > BigInt(0)) {
                newLinks.push({
                    source: iToId[i], target: iToId[j],
                    color: "white", label: "" + value
                });
            }
        }
    }
    return { nodes: nodes.map(n => ({...n})), links: newLinks };
}

function pathToSeed() {
    if (mutationGraph.nodesList.length <= 1) return [];
    var seedSig = mutationGraph.nodesList[0].id;
    if (mutationGraph.currentSig === seedSig) return [];
    var adj = {};
    for (var i = 0; i < mutationGraph.edges.length; i++) {
        var e = mutationGraph.edges[i];
        var s = (e.source && e.source.id !== undefined) ? e.source.id : e.source;
        var t = (e.target && e.target.id !== undefined) ? e.target.id : e.target;
        if (!adj[s]) adj[s] = [];
        if (!adj[t]) adj[t] = [];
        adj[s].push({ to: t, vid: e.vid });
        adj[t].push({ to: s, vid: e.vid });
    }
    var visited = {};
    visited[mutationGraph.currentSig] = true;
    var queue = [{ sig: mutationGraph.currentSig, path: [] }];
    while (queue.length > 0) {
        var cur = queue.shift();
        if (cur.sig === seedSig) return cur.path;
        var neighbors = adj[cur.sig] || [];
        for (var i = 0; i < neighbors.length; i++) {
            var nb = neighbors[i];
            if (visited[nb.to]) continue;
            visited[nb.to] = true;
            queue.push({ sig: nb.to, path: cur.path.concat([+nb.vid]) });
        }
    }
    return [];
}

function applyMutationSequence(snap, vids) {
    var cur = snap;
    for (var i = 0; i < vids.length; i++) cur = mutateSnap(cur, String(vids[i]));
    return cur;
}

function serializeMutationGraph() {
    if (!mutationGraph.baseSnap || mutationGraph.nodesList.length === 0) return null;
    var opsFlat = [];
    for (var i = 0; i < mutationGraph.ops.length; i++) {
        opsFlat.push(mutationGraph.ops[i].f, +mutationGraph.ops[i].v);
    }
    var positionsFlat = [];
    for (var i = 0; i < mutationGraph.nodesList.length; i++) {
        var n = mutationGraph.nodesList[i];
        if (n.fx != null && n.fy != null) {
            positionsFlat.push(i, Math.round(n.fx), Math.round(n.fy));
        }
    }
    var currentIdx = -1;
    for (var i = 0; i < mutationGraph.nodesList.length; i++) {
        if (mutationGraph.nodesList[i].id === mutationGraph.currentSig) { currentIdx = i; break; }
    }
    var result = [pathToSeed(), opsFlat, positionsFlat, currentIdx];
    var zoomChanged = mutationGraphZoom !== 1.0;
    if (customMutationGraphHeight !== null || zoomChanged) {
        result.push(customMutationGraphHeight !== null ? Math.round(customMutationGraphHeight) : 240);
    }
    if (zoomChanged) result.push(Math.round(mutationGraphZoom * 1000) / 1000);
    return result;
}

function restoreMutationGraph(data, currentSnap) {
    var seedSnap = applyMutationSequence(currentSnap, data.t || []);
    mutationGraph.baseSnap = seedSnap;
    mutationGraph.ops = data.o || [];
    mutationGraph.nodesBySig = {};
    mutationGraph.nodesList = [];
    mutationGraph.edges = [];
    mutationGraph.edgesKey = {};
    mutationGraph.nextLabel = 0;

    var baseSig = quiverSig(seedSnap.nodes, seedSnap.links);
    addQuiverNode(baseSig, seedSnap, { x: 0, y: 0 });

    for (var i = 0; i < mutationGraph.ops.length; i++) {
        var op = mutationGraph.ops[i];
        var fromNode = mutationGraph.nodesList[op.f];
        if (!fromNode) continue;
        var newSnap = mutateSnap(fromNode.snap, op.v);
        var newSig = quiverSig(newSnap.nodes, newSnap.links);
        var initPos = null;
        if (fromNode.x != null) {

        }
        addQuiverNode(newSig, newSnap, initPos);
        var vnode = fromNode.snap.nodes.find(n => n.id === op.v);
        var label = vnode ? vnode.label : "";
        if (fromNode.id !== newSig) addMutationEdge(fromNode.id, newSig, label, op.v);
    }

    var positions = data.p || {};
    var anyPos = false;
    for (var k in positions) {
        var idx = parseInt(k);
        var pos = positions[k];
        if (mutationGraph.nodesList[idx]) {
            mutationGraph.nodesList[idx].fx = pos[0];
            mutationGraph.nodesList[idx].fy = pos[1];
            mutationGraph.nodesList[idx].x = pos[0];
            mutationGraph.nodesList[idx].y = pos[1];
            anyPos = true;
        }
    }
    mutationGraphFrozen = anyPos;
    updateFreezeMgButtonText();

    var ci = data.c != null ? data.c : 0;
    if (mutationGraph.nodesList[ci]) {
        mutationGraph.currentSig = mutationGraph.nodesList[ci].id;
    } else {
        mutationGraph.currentSig = mutationGraph.nodesList[0].id;
    }
    mutationGraph.enabled = true;
    document.getElementById("mutationGraphPanel").style.display = "block";
    document.getElementById("mutationGraphButton").textContent = "HIDE MUTATION GRAPH";
    renderMutationGraph();
}

var _crc32Table = null;
function crc32(bytes) {
    if (!_crc32Table) {
        _crc32Table = new Uint32Array(256);
        for (var n = 0; n < 256; n++) {
            var c = n;
            for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
            _crc32Table[n] = c >>> 0;
        }
    }
    var crc = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ _crc32Table[(crc ^ bytes[i]) & 0xFF];
    return (crc ^ 0xFFFFFFFF) >>> 0;
}

function injectPngText(pngBytes, keyword, text) {
    var keyBytes = new TextEncoder().encode(keyword);
    var txtBytes = new TextEncoder().encode(text);
    var dataLen = keyBytes.length + 1 + txtBytes.length;
    var chunk = new Uint8Array(4 + 4 + dataLen + 4);
    chunk[0] = (dataLen >>> 24) & 0xFF;
    chunk[1] = (dataLen >>> 16) & 0xFF;
    chunk[2] = (dataLen >>> 8) & 0xFF;
    chunk[3] = dataLen & 0xFF;
    chunk[4] = 0x74; chunk[5] = 0x45; chunk[6] = 0x58; chunk[7] = 0x74; // "tEXt"
    var idx = 8;
    for (var i = 0; i < keyBytes.length; i++) chunk[idx++] = keyBytes[i];
    chunk[idx++] = 0;
    for (var i = 0; i < txtBytes.length; i++) chunk[idx++] = txtBytes[i];
    var crc = crc32(chunk.subarray(4, 8 + dataLen));
    var ci = 8 + dataLen;
    chunk[ci] = (crc >>> 24) & 0xFF;
    chunk[ci + 1] = (crc >>> 16) & 0xFF;
    chunk[ci + 2] = (crc >>> 8) & 0xFF;
    chunk[ci + 3] = crc & 0xFF;

    var pos = 8; // skip 8-byte signature
    while (pos + 8 <= pngBytes.length) {
        var len = (pngBytes[pos] << 24) | (pngBytes[pos + 1] << 16) | (pngBytes[pos + 2] << 8) | pngBytes[pos + 3];
        var type = String.fromCharCode(pngBytes[pos + 4], pngBytes[pos + 5], pngBytes[pos + 6], pngBytes[pos + 7]);
        if (type === "IEND") break;
        pos += 12 + len;
    }
    var result = new Uint8Array(pngBytes.length + chunk.length);
    result.set(pngBytes.subarray(0, pos), 0);
    result.set(chunk, pos);
    result.set(pngBytes.subarray(pos), pos + chunk.length);
    return result;
}

function extractPngText(pngBytes, keyword) {
    var keyBytes = new TextEncoder().encode(keyword);
    var pos = 8;
    while (pos + 8 <= pngBytes.length) {
        var len = (pngBytes[pos] << 24) | (pngBytes[pos + 1] << 16) | (pngBytes[pos + 2] << 8) | pngBytes[pos + 3];
        var type = String.fromCharCode(pngBytes[pos + 4], pngBytes[pos + 5], pngBytes[pos + 6], pngBytes[pos + 7]);
        if (type === "tEXt") {
            var ds = pos + 8;
            var match = true;
            for (var i = 0; i < keyBytes.length; i++) {
                if (pngBytes[ds + i] !== keyBytes[i]) { match = false; break; }
            }
            if (match && pngBytes[ds + keyBytes.length] === 0) {
                var ts = ds + keyBytes.length + 1;
                var te = ds + len;
                return new TextDecoder().decode(pngBytes.subarray(ts, te));
            }
        }
        if (type === "IEND") break;
        pos += 12 + len;
    }
    return null;
}

function ensureMutationGraphFrozen() {
    if (!mutationGraph.enabled) return;
    if (mutationGraphFrozen) return;
    mutationGraphFrozen = true;
    for (var i = 0; i < mutationGraph.nodesList.length; i++) {
        var n = mutationGraph.nodesList[i];
        n.fx = n.x;
        n.fy = n.y;
    }
    updateFreezeMgButtonText();
    if (mutationGraphSim) mutationGraphSim.alpha(0.05).restart();
    triggerURLUpdate();
}

function renderSvgToImage(svgEl, w, h) {
    return new Promise(function(resolve, reject) {
        var clone = svgEl.cloneNode(true);
        clone.setAttribute("width", w);
        clone.setAttribute("height", h);
        clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
        var svgStr = new XMLSerializer().serializeToString(clone);
        var blob = new Blob([svgStr], { type: "image/svg+xml;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var img = new Image();
        img.onload = function() { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = function(e) { URL.revokeObjectURL(url); reject(e); };
        img.src = url;
    });
}

function exportQuiverPng() {
    ensureMutationGraphFrozen();
    var mainSvg = document.querySelector(".graph-container > svg");
    if (!mainSvg) return;
    var mainRect = mainSvg.getBoundingClientRect();
    var w = Math.round(mainRect.width), h = Math.round(mainRect.height);

    var mgPanel = document.getElementById("mutationGraphPanel");
    var mgVisible = mgPanel && mgPanel.style.display !== "none" && mutationGraph.enabled;
    var mgSvgEl = mgVisible ? document.getElementById("mutationGraphSvg") : null;
    var mgRect = mgPanel && mgVisible ? mgPanel.getBoundingClientRect() : null;

    var promises = [renderSvgToImage(mainSvg, w, h)];
    if (mgSvgEl) {
        var mgSvgRect = mgSvgEl.getBoundingClientRect();
        promises.push(renderSvgToImage(mgSvgEl, Math.round(mgSvgRect.width), Math.round(mgSvgRect.height)));
    }

    Promise.all(promises).then(function(images) {
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(images[0], 0, 0, w, h);
        if (images[1]) {
            var mgX = mgRect.left - mainRect.left;
            var mgY = mgRect.top - mainRect.top;
            var mgW = mgRect.width, mgH = mgRect.height;
            // Match on-screen styling: dark translucent backdrop + lighter top-bar strip.
            ctx.fillStyle = "rgba(10,10,10,0.5)";
            ctx.fillRect(mgX, mgY, mgW, mgH);
            ctx.fillStyle = "rgba(255,255,255,0.15)";
            ctx.fillRect(mgX, mgY, mgW, 14);
            ctx.fillStyle = "rgba(255,255,255,0.5)";
            ctx.fillRect(mgX + mgW / 2 - 20, mgY + 5, 40, 3);
            ctx.drawImage(images[1], mgX, mgY, mgW, mgH);
        }
        canvas.toBlob(function(blob) {
            blob.arrayBuffer().then(function(buf) {
                var pngBytes = new Uint8Array(buf);
                var hashStr = window.location.hash || "";
                if (hashStr.charAt(0) === "#") hashStr = hashStr.substring(1);
                var withMeta = injectPngText(pngBytes, "QuiverHash", hashStr);
                var outBlob = new Blob([withMeta], { type: "image/png" });
                var dlUrl = URL.createObjectURL(outBlob);
                var a = document.createElement("a");
                a.href = dlUrl;
                a.download = "quiver.png";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(function() { URL.revokeObjectURL(dlUrl); }, 200);
            });
        }, "image/png");
    }).catch(function(e) {
        alert("Failed to render for export");
        console.error(e);
    });
}

var pendingImportCenter = false;

function centerMainQuiver() {
    if (typeof simulation === 'undefined' || !simulation || typeof simulation.nodes !== 'function') return;
    var nodes = simulation.nodes();
    if (!nodes || nodes.length === 0) return;
    var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        if (n.x == null || n.y == null) continue;
        if (n.x < minX) minX = n.x;
        if (n.x > maxX) maxX = n.x;
        if (n.y < minY) minY = n.y;
        if (n.y > maxY) maxY = n.y;
    }
    if (minX === Infinity) return;
    var dx = -(minX + maxX) / 2;
    var dy = -(minY + maxY) / 2;
    for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        if (n.x != null) n.x += dx;
        if (n.y != null) n.y += dy;
        if (n.fx != null) n.fx += dx;
        if (n.fy != null) n.fy += dy;
    }
    simulation.alpha(0.05).restart();
}

function centerMutationGraph() {
    if (!mutationGraph.enabled || mutationGraph.nodesList.length === 0) return;
    var nodes = mutationGraph.nodesList;
    var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        if (n.x == null || n.y == null) continue;
        if (n.x < minX) minX = n.x;
        if (n.x > maxX) maxX = n.x;
        if (n.y < minY) minY = n.y;
        if (n.y > maxY) maxY = n.y;
    }
    if (minX === Infinity) return;
    var svgEl = document.getElementById("mutationGraphSvg");
    if (!svgEl) return;
    var rect = svgEl.getBoundingClientRect();
    var info = mgViewportInfo(rect.width, rect.height);
    var dx = info.centerX - (minX + maxX) / 2;
    var dy = info.centerY - (minY + maxY) / 2;
    for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        if (n.x != null) n.x += dx;
        if (n.y != null) n.y += dy;
        if (n.fx != null) n.fx += dx;
        if (n.fy != null) n.fy += dy;
    }
    if (mutationGraphSim) mutationGraphSim.alpha(0.05).restart();
}

function importQuiverPng(file) {
    if (!file) return;
    file.arrayBuffer().then(function(buf) {
        var bytes = new Uint8Array(buf);
        var hashStr = extractPngText(bytes, "QuiverHash");
        if (!hashStr) {
            alert("No quiver data found in this PNG");
            return;
        }
        pendingImportCenter = true;
        window.location.hash = "#" + hashStr;
    });
}

function exportQuiverJson() {
    ensureMutationGraphFrozen();
    var hash = window.location.hash || "";
    if (hash.charAt(0) === "#") hash = hash.substring(1);
    if (!hash) {
        alert("No quiver data to export");
        return;
    }
    var parsed;
    try {
        parsed = JSON.parse(decodeURI(hash));
    } catch (e) {
        alert("Failed to parse current state: " + e.message);
        return;
    }
    var n = (parsed[1] || []).length;
    var weightsInner = (parsed[0] || "").replace(/_/g, "");
    weightsInner = weightsInner.substring(1, weightsInner.length - 1);
    var pieces = weightsInner.length > 0 ? weightsInner.split(",") : [];
    var bMatrix = [];
    for (var i = 0; i < n; i++) {
        var row = [];
        for (var j = 0; j < n; j++) {
            var v = pieces[i * n + j];
            row.push(v != null ? parseInt(v) : 0);
        }
        bMatrix.push(row);
    }
    var structured = {
        bMatrix: bMatrix,
        labels: parsed[1],
        positions: parsed[2],
        frozen: parsed[3]
    };
    if (parsed.length >= 8) {
        var opsFlat = parsed[5] || [];
        var ops = [];
        for (var i = 0; i < opsFlat.length; i += 2) {
            ops.push({ from: opsFlat[i], vertex: opsFlat[i + 1] });
        }
        var posFlat = parsed[6] || [];
        var pinned = {};
        for (var i = 0; i < posFlat.length; i += 3) {
            pinned[posFlat[i]] = [posFlat[i + 1], posFlat[i + 2]];
        }
        structured.mutationGraph = {
            pathToSeed: parsed[4] || [],
            ops: ops,
            pinned: pinned,
            currentIdx: parsed[7]
        };
        if (parsed.length >= 9) structured.mutationGraph.height = parsed[8];
        if (parsed.length >= 10) structured.mutationGraph.zoom = parsed[9];
    }
    var pretty = JSON.stringify(structured, null, 2);
    var blob = new Blob([pretty], { type: "application/json" });
    var dlUrl = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = dlUrl;
    a.download = "quiver.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(dlUrl); }, 200);
}

function importQuiverJson(file) {
    if (!file) return;
    file.text().then(function(text) {
        var data;
        try {
            data = JSON.parse(text);
        } catch (e) {
            alert("Failed to parse JSON file: " + e.message);
            return;
        }
        var weightsStr;
        if (data.bMatrix) {
            var flat = [];
            for (var i = 0; i < data.bMatrix.length; i++) {
                var row = data.bMatrix[i];
                for (var j = 0; j < row.length; j++) flat.push(row[j] + "");
            }
            weightsStr = "____[" + flat.join(",") + "]____";
        } else if (data.weights) {
            weightsStr = data.weights;
        } else {
            alert("JSON is missing bMatrix");
            return;
        }
        var arr = [weightsStr, data.labels, data.positions, data.frozen];
        if (data.mutationGraph) {
            var mg = data.mutationGraph;
            arr.push(mg.pathToSeed || []);
            var opsFlat = [];
            var opsArr = mg.ops || [];
            for (var i = 0; i < opsArr.length; i++) {
                opsFlat.push(opsArr[i].from, opsArr[i].vertex);
            }
            arr.push(opsFlat);
            var posFlat = [];
            var pinned = mg.pinned || {};
            for (var k in pinned) {
                posFlat.push(parseInt(k), pinned[k][0], pinned[k][1]);
            }
            arr.push(posFlat);
            arr.push(mg.currentIdx != null ? mg.currentIdx : 0);
            var hasHeight = mg.height != null;
            var hasZoom = mg.zoom != null;
            if (hasHeight || hasZoom) arr.push(hasHeight ? mg.height : 240);
            if (hasZoom) arr.push(mg.zoom);
        }
        pendingImportCenter = true;
        window.location.hash = "#" + encodeURI(JSON.stringify(arr));
    });
}

function importQuiverFile(file) {
    if (!file) return;
    var name = (file.name || "").toLowerCase();
    if (name.endsWith(".json") || file.type === "application/json") {

}

function snapToImage(snap) {
    if (!snap || !snap.nodes || snap.nodes.length === 0) return null;
    var nodes = snap.nodes, links = snap.links || [];
    var nodeRadius = 30;

    // Prefer current canvas positions (matches what's displayed); fall back to snap positions.
    var curPos = {};
    if (typeof simulation !== 'undefined' && simulation && typeof simulation.nodes === 'function') {
        var sn = simulation.nodes();
        for (var i = 0; i < sn.length; i++) curPos[sn[i].id] = { x: sn[i].x, y: sn[i].y };
    }

    var posById = {};
    var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, anyPos = false;
    for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        var cp = curPos[n.id];
        var px = cp ? cp.x : n.x;
        var py = cp ? cp.y : n.y;
        if (px == null || py == null) continue;
        posById[n.id] = { x: px, y: py, label: n.label, frozen: n.frozen };
        if (px < minX) minX = px;
        if (px > maxX) maxX = px;
        if (py < minY) minY = py;
        if (py > maxY) maxY = py;
        anyPos = true;
    }
    if (!anyPos) return null;

    var pad = nodeRadius + 10;
    var contentW = Math.max(maxX - minX, 1);
    var contentH = Math.max(maxY - minY, 1);
    var vbW = contentW + pad * 2;
    var vbH = contentH + pad * 2;
    function tx(x) { return x - minX + pad; }
    function ty(y) { return y - minY + pad; }

    function intersect(cx, cy, tx_, ty_, r) {
        var dx = tx_ - cx, dy = ty_ - cy;
        var len = Math.sqrt(dx * dx + dy * dy);
        if (len === 0) return { x: cx, y: cy };
        return { x: cx + dx / len * r, y: cy + dy / len * r };
    }

    var parts = ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + vbW + ' ' + vbH + '">'];
    parts.push('<defs><marker id="mgArrow" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,-5L10,0L0,5" fill="none" stroke="white" stroke-width="1"/></marker></defs>');

    for (var i = 0; i < links.length; i++) {
        var link = links[i];
        var s = posById[link.source], t = posById[link.target];
        if (!s || !t) continue;
        var sx = tx(s.x), sy = ty(s.y), txp = tx(t.x), typ = ty(t.y);
        var sp = intersect(sx, sy, txp, typ, nodeRadius);
        var tp = intersect(txp, typ, sx, sy, nodeRadius);
        parts.push('<line x1="' + sp.x + '" y1="' + sp.y + '" x2="' + tp.x + '" y2="' + tp.y + '" stroke="white" stroke-width="2" marker-end="url(#mgArrow)"/>');
        if (link.label != null && link.label !== "") {
            var mx = (sx + txp) / 2;
            var my = (sy + typ) / 2 + 5;
            parts.push('<text x="' + mx + '" y="' + my + '" font-family="sans-serif" font-size="25" text-anchor="middle" fill="white">' + mgEscapeXml(link.label) + '</text>');
        }
    }

    for (var id in posById) {
        var p = posById[id];
        var fill = p.frozen ? "#555" : "black";
        parts.push('<circle cx="' + tx(p.x) + '" cy="' + ty(p.y) + '" r="' + nodeRadius + '" fill="' + fill + '" stroke="white" stroke-width="2"/>');
        if (p.label != null && p.label !== "") {
            parts.push('<text x="' + tx(p.x) + '" y="' + (ty(p.y) + 8) + '" font-family="sans-serif" font-size="25" text-anchor="middle" fill="white">' + mgEscapeXml(p.label) + '</text>');
        }
    }

    parts.push('</svg>');
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(parts.join(''));
}

function mgViewportInfo(rectW, rectH) {
    var k = mutationGraphZoom || 1;

    var ax = rectW / 2, ay = mgZoomAnchorY;

    var handleBottomCoord = (handleH - ay) / k + ay;
    var visX0 = ax * (1 - 1 / k);
    var visY0 = ay * (1 - 1 / k);
    var visW = rectW / k;
    var visH = rectH / k;
    var minX = visX0 + pad;
    var maxX = visX0 + visW - pad;
    var minY = handleBottomCoord + pad;
    var maxY = visY0 + visH - pad;
    return {
        anchorX: ax, anchorY: ay,
        minX: minX, maxX: maxX,
        minY: minY, maxY: maxY,
        centerX: (minX + maxX) / 2,
        centerY: (minY + maxY) / 2
    };
}

    if (currentNodes.length > 0) {

            parseInt((n.id + "").replace(/[^0-9]/g, '')) || 0
        ));
    }

    var newNodes = [...currentNodes];
    var newLinks = [...currentLinks];
    var offset = 80;

    for (var i = 0; i < currentNodes.length; i++) {

        if (orig.frozen) continue;
        maxId += 1;
        var newId = maxId.toString();
        newNodes.push({
            id: newId,
            color: "white",
            x: orig.x,
            y: orig.y - offset,
            label: orig.label + "'",
            frozen: true
        });
        newLinks.push({

            target: orig.id,

      // Right boundary
      if (node.x > width/2 - padding) {
        node.x = width/2 - padding;
        node.vx = -Math.abs(node.vx) * 0.5;
      }
      // Top boundary
      if (node.y < -height/2 + padding) {
        node.y = -height/2 + padding;
        node.vy = Math.abs(node.vy) * 0.5;
      }
      // Bottom boundary
      if (node.y > height/2 - padding) {
        node.y = height/2 - padding;
        node.vy = -Math.abs(node.vy) * 0.5;
      }
    }
  }

        // Vector from center to end point
        const dx = x2 - cx;
        const dy = y2 - cy;
        // Length of this vector
        const length = Math.sqrt(dx * dx + dy * dy);
        
        if (length === 0) return { x: cx, y: cy };
        
        // Unit vector
        const udx = dx / length;
        const udy = dy / length;
        
        // Point on circle, moved back by 10 pixels to accommodate arrow
        return {
            x: cx + udx * (r),  // Subtract 10 pixels to make room for arrow

  function getLabelPosition(source, target){
    var avgX = (source.x+target.x)/2.0;
    var avgY = (source.y+target.y)/2.0;
    return {x: avgX, y: avgY+5};
    var dx = source.x-target.x;
    var dy = source.y-target.y;
    var mag = Math.sqrt(dx*dx+dy*dy);
    if (mag == 0) {
        mag = 1.0;
    }
    var normX = dx/mag;
    var normY = dy/mag;
    // rotate vector 90 degrees
    var shiftAmount = 10;
    var shiftX = normY*shiftAmount;
    var shiftY = -normX*shiftAmount;
    var extraShift = 5;
    // account for weird text going too high or too low
    if (normX < 0) {
        shiftY -= extraShift*normX;
    }
    else {
        shiftY += extraShift*normX;
    }
    return {x: avgX+shiftX, y: avgY+shiftY};

function matMul(A, B) {
    var n = A.length;
    var m = A[0].length;
    var l = B[0].length;
    var res = makeArr(n, i => makeArr(l, j => BigInt(0)));
    for(var i = 0; i < n; i++){
        for (var j = 0; j < l; j++){
            var val = [];
            // dot A[i][k] with B[k][j]
            for (var k = 0; k < m; k++){
                var multVal = A[i][k]*B[k][j];
                if (multVal != 0) {
                    val.push(multVal)
                }
            }
            var valSum = val.reduce((partialSum, a) => partialSum + a, BigInt(0));
            res[i][j] = BigInt(valSum);
        }
    }
    return res;
}

// n + (n-1) + (n-2) + ... + 2 + 1
function additiveFactorial(n) {
    return (n*n+n)/2;
}

function dimToNWeights(dim) {
    return additiveFactorial(dim-1);
}

// inverse of additive factorial, also with a shift
function nWeightsToDim(nWeights) {
    return Math.round(Math.sqrt(8*nWeights+1)/2-1.0/2.0)+1;
}

function bMatrixToWeights(b_matrix) {
    var weights = []
    var dim = b_matrix.length;
    for (var offset = 1; offset < dim; offset++) {
        for (var i = 0; i < dim-offset; i++) {
            weights.push(b_matrix[i][i+offset]);
        }
    }
    return weights;
}

function weightsToBMatrix(weights) {
    var dim = nWeightsToDim(weights.length);
    var b_matrix = makeArr(dim, i => makeArr(dim, j => BigInt(0)));
    // [0, 1]
    // [1, 2]
    // [2, 3] 
    // ...
    // [dim-2,dim-2+1]
    // then
    // [0, 2]
    // [1, 3]
    // ...
    // [dim-3, dim-3+2]
    // ...
    // [0, dim-1]
    var j = 0;
    for (var offset = 1; offset < dim; offset++) {
        for (var i = 0; i < dim-offset; i++) {
            b_matrix[i][i+offset] = BigInt(weights[j]);
            b_matrix[i+offset][i] = -BigInt(weights[j]); // at transpose position, put negative value
            j += 1;
        }
    }
    return b_matrix;
}

function BigIntMax(a, b) {
    if (a >= b) { return a; }
    else { return b; }
}

var Quiver;
Quiver = function(weights){
  this.b_matrix = weightsToBMatrix(weights);
  var myQ = this;
  
  this.getWeights = function() {
    return bMatrixToWeights(myQ.b_matrix);
  };
  
  this.mutate = function(index, inplace) {
    var quiv = myQ.b_matrix;
    var ncols = quiv.length;
    var incomingEdges = [];
    // see https://arxiv.org/pdf/1608.05735.pdf on bottom of page 33
    // we can use that formula
    var k = index;
    // J matrix is all 1s on diagonal except -1 at (mutateI, mutateI)
    var JMat = makeArr(ncols, i => makeArr(ncols, j => BigInt(0)));
    for (var i = 0; i < ncols; i++){
        if (i == k) {
            JMat[i][i] = BigInt(-1);
        }
        else {
            JMat[i][i] = BigInt(1);
        }
    }

    var EMat = makeArr(ncols, i => makeArr(ncols, j => BigInt(0)));
    for (var i = 0; i < ncols; i++) {
        EMat[i][k] = BigIntMax(BigInt(0), -quiv[i][k]);
    }

    var FMat = makeArr(ncols, i => makeArr(ncols, j => BigInt(0)));
    for (var j = 0; j < ncols; j++) {
        FMat[k][j] = BigIntMax(BigInt(0), quiv[k][j]);
    }

    var lhsMat = makeArr(ncols, i => makeArr(ncols, j => BigInt(0)));
    var rhsMat = makeArr(ncols, i => makeArr(ncols, j => BigInt(0)));
    for (var i = 0; i < ncols; i++) {
        for (var j = 0; j < ncols; j++) {
            lhsMat[i][j] = JMat[i][j] + EMat[i][j];
            rhsMat[i][j] = JMat[i][j] + FMat[i][j];
        }
    }
    var res = matMul(matMul(lhsMat, quiv), rhsMat);
    if (inplace) {
        myQ.b_matrix = res;
    }
    else {
        return new Quiver(bMatrixToWeights(res));
    }
  };
};

function compressToBase64(str) {
    return new Promise((resolve) => {
        LZMA.compress(str, 9, (result) => {
            // Convert Uint8Array to base64
            bufferToBase64(result).then(data => {
                resolve(data);
            });
        });
    });
}

function decompressFromBase64(base64Str) {
    return new Promise((resolve) => {
        LZMA.decompress(base64ToBytes(base64Str), (result) => {
            console.log("got result: " + result);
            resolve(result);
        });
    });
}

function base64ToBytes(base64Str) {
    return Uint8Array.fromBase64(base64Str)
}

function compressState(obj) {
    return compressToBase64(JSON.stringify(obj));
}

async function decompressState(compressed) {
    try {
        return JSON.parse(decompressFromBase64(compressed));
    }
    catch (e) {
        console.error('Base64 decode error:', e);
        return null;
    }
}

    var idToI = {};

    }

    // get bmat
    var ncols = nodes.length;
    var bMat = makeArr(ncols, i => makeArr(ncols, j => BigInt(0)));
 
 
    links.map(link => {
        var i = idToI[link.source + ""];
        var j = idToI[link.target + ""];
        bMat[i][j] = BigInt(link.label);
        bMat[j][i] = -BigInt(link.label);
   });
   return bMat;

}

var tmpStrReplace = "__TMPCHARHERE";

var specialChar = ".";
function decodeURI(x) {
    x = decodeURIComponent(x);
    x = x.replaceAll(specialChar, tmpStrReplace).replaceAll(",", specialChar).replaceAll(tmpStrReplace, ",")
    return x;
}

function encodeURI(x) {
    x = x.replaceAll(specialChar, tmpStrReplace).replaceAll(",", specialChar).replaceAll(tmpStrReplace, ",")
    return encodeURIComponent(x);
}


function loadGraphFromHash() {
    if (window.location.hash) {
            var hash = decodeURI(window.location.hash).substring(1); // remove the #
            console.log("Got hash:" + hash);
            var parsed = JSON.parse(hash);
            var edgesStr = parsed[0], names = parsed[1], pos = parsed[2], frozen = parsed[3] || [];
            var mgData = null;
            if (parsed.length >= 8) {
                var tArr = parsed[4] || [];
                var opsFlat = parsed[5] || [];
                var posFlat = parsed[6] || [];
                var cIdx = parsed[7];
                var opsRebuilt = [];
                for (var oi = 0; oi < opsFlat.length; oi += 2) {
                    opsRebuilt.push({ f: opsFlat[oi], v: String(opsFlat[oi + 1]) });
                }
                var posRebuilt = {};
                for (var pi = 0; pi < posFlat.length; pi += 3) {
                    posRebuilt[posFlat[pi]] = [posFlat[pi + 1], posFlat[pi + 2]];
                }
                mgData = { t: tArr, o: opsRebuilt, p: posRebuilt, c: cIdx };
                if (parsed.length >= 9) {
                    customMutationGraphHeight = parsed[8];
                    var mgPanel = document.getElementById("mutationGraphPanel");
                    if (mgPanel) mgPanel.style.height = customMutationGraphHeight + "px";
                }
                if (parsed.length >= 10) {
                    mutationGraphZoom = parsed[9];
                }
            }
            var nodes = [];

            for (var i = 0; i < names.length; i++) {
                nodes.push({
                    x: parseFloat(pos[i][0]),
                    y: parseFloat(pos[i][1]),
                    label: names[i].trim() + "",
                    id: i + "",
                    color: "white",
                    frozen: frozen[i] == 1,
                });
            }
            
            edgesStr = edgesStr.replaceAll("_", "");
            edgesStr = edgesStr.substring(1);
            edgesStr = edgesStr.substring(0, edgesStr.length - 1);
            pieces = edgesStr.split(",");
            console.log("pieces:" + pieces);
            resultEdgesWeights = [];
            for (var i = 0; i < pieces.length; i++) {
                resultEdgesWeights.push(BigInt(pieces[i]));
            }
            var ncols = Math.ceil(Math.sqrt(resultEdgesWeights.length));
            var bMat = makeArr(ncols, i => makeArr(ncols, j => BigInt(0)));
            var ind = 0;
            for (var i = 0; i < ncols; i++) {
                for (var j = 0; j < ncols; j++) {
                    bMat[i][j] = pieces[ind];
                    ind += 1;
                    if (pieces.length <= ind) {
                        break;
                    }
                }
            }
            
           var newLinks = [];
           for (var i = 0; i < bMat.length; i++) {
              for (var j = 0; j < bMat.length; j++) {
                var value = bMat[i][j];
                if (value > BigInt(0)) {
                    newLinks.push({
                        source: i + "",
                        target: j + "",
                        color: "white",
                        label: "" + value
                    });
                }
              }
           }
            
              // Create new force graph with updated data
              ForceGraph({
                  nodes: nodes,
                  links: newLinks
              });
              if (mgData) {
                  var currentSnap = {
                      nodes: nodes.map(n => ({...n})),
                      links: newLinks.map(l => ({...l}))
                  };
                  restoreMutationGraph(mgData, currentSnap);
              }
              if (pendingImportCenter) {
                  pendingImportCenter = false;
                  centerMainQuiver();
                  if (mgData) centerMutationGraph();
                  triggerURLUpdate();
              }
              return true;
    }
    else {
        return false;
    }
}

<script>
// External SVG-thumbnail hook for the Extras "Quiver" window — returns a small
// data:image/svg+xml preview of the current quiver so saved quivers show who's
// who in the browse list (like the fractal previews). Synchronous.
window.QuiverApp = window.QuiverApp || {};
window.QuiverApp.thumbnail = function () {
  try {
    var svg = document.querySelector('.graph-container > svg');
    if (!svg) return null;
    var clone = svg.cloneNode(true);
    clone.setAttribute('width', 240);
    clone.setAttribute('height', 180);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    // Dark backdrop covering the viewBox so the preview matches the app.
    var vb = (svg.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
    if (vb.length === 4 && vb.every(function (n) { return isFinite(n); })) {
      var bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      bg.setAttribute('x', vb[0]); bg.setAttribute('y', vb[1]);
      bg.setAttribute('width', vb[2]); bg.setAttribute('height', vb[3]);
      bg.setAttribute('fill', '#111');
      clone.insertBefore(bg, clone.firstChild);
    }
    var str = new XMLSerializer().serializeToString(clone);
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
  } catch (e) { return null; }
};
</script>
